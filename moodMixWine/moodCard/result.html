<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mood Mix - Emotion Helix</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js & Tween.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow: hidden; background-color: #030305; font-family: 'Inter', sans-serif; color: #fff;}
        
        #video-element {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1); z-index: 0;
            filter: brightness(0.3) blur(8px) contrast(1.1); /* Dark energetic AR background */
        }

        #canvas-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; pointer-events: none; 
        }
        
        /* Glass UI */
        #ui-layer {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 90%; max-width: 400px;
            background: rgba(10, 10, 15, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 28px; padding: 24px; text-align: center; pointer-events: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: opacity 0.5s, transform 0.5s;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase;}
        p { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6;}

        /* Hand Tracking Indicator */
        .cursor-indicator {
            position: absolute; width: 60px; height: 60px;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            z-index: 5; transform: translate(-50%, -50%); display: none;
            pointer-events: none; transition: width 0.15s, height 0.15s, border-color 0.15s;
        }
        .cursor-indicator::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; background: #fff; border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 15px #fff;
        }
        
        /* Grabbing State */
        .cursor-indicator.grabbing {
            width: 30px; height: 30px; border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        /* Flash overlay */
        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; z-index: 15; pointer-events: none;
        }

        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #030305; z-index: 20; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #fff; border-radius: 50%; animation: spin 1s cubic-bezier(0.5,0,0.5,1) infinite; margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <video id="video-element" playsinline></video>
    <div id="canvas-container"></div>
    
    <div id="hand-cursor" class="cursor-indicator"></div>
    <div id="flash"></div>

    <div id="ui-layer">
        <h1 id="ui-title">The Emotion Helix</h1>
        <p id="ui-instruction">1. 将手悬停在旋转的卡牌带上<br>2. 拇指与食指捏合 抓取情绪</p>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p style="letter-spacing:2px; font-family:'Inter'">CALIBRATING SPATIAL NEURAL NET...</p>
    </div>

<script>
    // --- 1. Three.js: Context & Helix Setup ---
    let scene, camera, renderer, raycaster;
    let carouselGroup;
    let cardGroups = [];
    let currentDrawnCard = null;
    let isCarouselActive = true;

    const emotions = [
        { label: "TIGHT", desc: "高压紧绷" },
        { label: "DEEP", desc: "沉夜深邃" },
        { label: "CALM", desc: "绝对宁静" },
        { label: "JOY", desc: "活跃明亮" },
        { label: "CHAOS", desc: "无序轰鸣" },
        { label: "MILD", desc: "温和边界" }
    ];

    function initThree() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();

        // Spatial Camera
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25; 
        camera.position.y = 2;
        camera.lookAt(0, 0, 0);

        raycaster = new THREE.Raycaster();

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Core Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 10);
        scene.add(dirLight);

        // Sub-lighting pointing slightly from below for the spatial feel
        const bottomLight = new THREE.DirectionalLight(0xa78bfa, 0.4); 
        bottomLight.position.set(0, -10, 5);
        scene.add(bottomLight);

        buildHelix();

        window.addEventListener('resize', onWindowResize, false);
    }

    // Front: High Contrast Minimal Texture
    function createFrontTexture(title, subtitle) {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 768; 
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, c.width, c.height);

        // Thick border
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 24;
        ctx.strokeRect(32, 32, 512 - 64, 768 - 64);

        ctx.fillStyle = '#000000';
        ctx.font = '600 24px Inter';
        ctx.textAlign = 'center';
        ctx.fillText("MOOD DATA", c.width/2, 100);

        // Center Keyword
        ctx.font = '900 85px Inter';
        ctx.fillText(title, c.width/2, c.height/2 + 10);

        // Elegant Description
        ctx.font = '400 36px "Playfair Display"';
        ctx.fillText(subtitle, c.width/2, c.height/2 + 80);

        ctx.font = '500 16px Inter';
        ctx.fillText("INDEX: " + Math.floor(Math.random()*99999), c.width/2, c.height - 80);

        const tex = new THREE.CanvasTexture(c);
        tex.minFilter = THREE.LinearFilter;
        return tex;
    }

    // Back: Rainbow/Iridescent Texture
    function createHoloTexture(index) {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 768;
        const ctx = c.getContext('2d');
        
        // Slightly different gradient directions based on index
        const ang = (index * 45) * Math.PI / 180;
        const x2 = 256 + Math.cos(ang) * 512;
        const y2 = 384 + Math.sin(ang) * 768;

        const grad = ctx.createLinearGradient(0, 0, x2, y2);
        
        // Iridescent Palettes
        const palettes = [
            ['#f43f5e', '#8b5cf6', '#3b82f6'],
            ['#10b981', '#3b82f6', '#8b5cf6'],
            ['#f59e0b', '#ec4899', '#8b5cf6'],
            ['#00f2fe', '#4facfe', '#a18cd1']
        ];
        const p = palettes[index % palettes.length];

        grad.addColorStop(0, p[0]);
        grad.addColorStop(0.5, p[1]);
        grad.addColorStop(1, p[2]);

        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, c.width, c.height);

        // Add geometric "Energy Grid"
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 2;
        for(let i=0; i<15; i++) {
            ctx.beginPath();
            ctx.arc(c.width/2, c.height/2, 50 * i, 0, Math.PI*2);
            ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(c);
        tex.minFilter = THREE.LinearFilter;
        return tex;
    }

    function buildHelix() {
        carouselGroup = new THREE.Group();
        scene.add(carouselGroup);

        const cardGeo = new THREE.PlaneGeometry(5, 7.5); 
        const numCards = 12;
        const radius = 9;

        for(let i=0; i<numCards; i++) {
            const group = new THREE.Group();
            
            const em = emotions[i % emotions.length];
            
            // Materials
            const matFront = new THREE.MeshStandardMaterial({ 
                map: createFrontTexture(em.label, em.desc), 
                roughness: 0.2, metalness: 0.1 
            });
            const matBack = new THREE.MeshStandardMaterial({ 
                map: createHoloTexture(i), 
                roughness: 0.05, metalness: 0.4 // Sleeker, more mirror-like
            });

            // Two planes back to back
            const frontMesh = new THREE.Mesh(cardGeo, matFront);
            frontMesh.position.z = 0.02;

            const backMesh = new THREE.Mesh(cardGeo, matBack);
            backMesh.position.z = -0.02;
            backMesh.rotation.y = Math.PI; // Flip back to face opposite

            group.add(frontMesh);
            group.add(backMesh);
            
            // Layout in a cylinder/helix
            const angle = (i / numCards) * Math.PI * 2;
            
            group.position.x = Math.cos(angle) * radius;
            group.position.z = Math.sin(angle) * radius;
            
            // Slightly staggering height for "Helix" effect
            group.position.y = Math.sin(angle * 2) * 1.5;

            // Orient carefully: We want the BACK (Color) facing OUTWARDS towards user initially.
            // When grouped, Group's Z is facing user. 
            // `group.lookAt(0, group.position.y, 0)` means front faces INWARD, back faces OUTWARD.
            group.lookAt(0, group.position.y, 0);

            group.userData = { 
                originalPos: group.position.clone(), 
                originalRot: group.rotation.clone(), 
                emotion: em 
            };
            
            carouselGroup.add(group);
            cardGroups.push(group);
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animateThree(time) {
        requestAnimationFrame(animateThree);
        TWEEN.update(time);

        // Continuous Carousel Spin
        if(isCarouselActive) {
            carouselGroup.rotation.y -= 0.003;
        }

        renderer.render(scene, camera);
    }

    // --- 2. Action: Hover & Pinch Selection ---
    
    // We check raycasting explicitly from CV loop to avoid doing it every rendered frame
    function processInteractionRay(screenX, screenY, isPinching) {
        if(currentDrawnCard) return; // Busy animating

        // Convert to Normalized Device Coords (-1 to +1)
        const mouse = new THREE.Vector2();
        mouse.x = (screenX / window.innerWidth) * 2 - 1;
        mouse.y = -(screenY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        // Intersect against kids of the cardGroups (the actual meshes)
        let meshes = [];
        cardGroups.forEach(g => { meshes.push(g.children[0], g.children[1]); });
        
        const intersects = raycaster.intersectObjects(meshes);

        // Reset scales for visual feedback
        cardGroups.forEach(g => {
            // Lerp scale back to 1
            g.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
        });

        if (intersects.length > 0) {
            // Find parent Group of the intersected Mesh
            let hitGroup = intersects[0].object.parent;
            
            // Apply a slight springy scale up
            hitGroup.scale.lerp(new THREE.Vector3(1.15, 1.15, 1.15), 0.2);

            // If user pinches while hovering over this card!
            if (isPinching) {
                executeCardReveal(hitGroup);
            }
        }
    }

    function executeCardReveal(group) {
        if(currentDrawnCard) return;
        currentDrawnCard = group;
        isCarouselActive = false; // Freeze the deck rotation

        const flash = document.getElementById('flash');
        const uiTitle = document.getElementById('ui-title');
        const uiInst = document.getElementById('ui-instruction');

        // Modify UI
        document.getElementById('ui-layer').style.transform = "translateX(-50%) translateY(120%)"; // hide down
        
        // 1. Un-parent from the rotating carousel to the fixed scene so it can fly directly to camera
        const worldPos = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        group.getWorldPosition(worldPos);
        group.getWorldQuaternion(worldQuat);

        carouselGroup.remove(group);
        scene.add(group);
        group.position.copy(worldPos);
        group.quaternion.copy(worldQuat);

        // 2. Animate to camera face-on (Front face visible)
        // Since front face is +Z of the group, setting group rotation to identity means front faces +Z (towards camera).
        
        new TWEEN.Tween(group.position)
            .to({ x: 0, y: 0, z: camera.position.z - 8 }, 800)
            .easing(TWEEN.Easing.Back.Out)
            .start();

        // Reveal sequence: Spin rapidly then present the minimal front face
        new TWEEN.Tween(group.rotation)
            .to({ x: 0, y: Math.PI * 2, z: 0 }, 800) 
            .easing(TWEEN.Easing.Cubic.Out)
            .onUpdate((obj, elapsed) => {
                // Highlighting the 'color collapse' moment
                if(elapsed > 0.7 && flash.style.opacity === "0") {
                    flash.style.opacity = "1";
                    
                    // Update text under flash
                    uiTitle.innerText = "配方生成完成";
                    uiInst.innerHTML = `已捕获状态: <strong style="color:#000; background:#fff; padding:2px 6px">${group.userData.emotion.desc}</strong>`;
                    document.getElementById('ui-layer').style.transform = "translateX(-50%) translateY(0)"; // show
                    
                    setTimeout(() => flash.style.opacity = "0", 300);
                }
            })
            .onComplete(() => {
                // Return to carousel after 4 seconds
                setTimeout(resetCard, 4000);
            })
            .start();
    }

    function resetCard() {
        if(!currentDrawnCard) return;
        const group = currentDrawnCard;

        document.getElementById('ui-layer').style.transform = "translateX(-50%) translateY(120%)"; // hide again

        // 1. Move back into carousel Group space
        scene.remove(group);
        carouselGroup.add(group);
        
        const targetPos = group.userData.originalPos;
        const targetRot = group.userData.originalRot;

        // Needs to map current world transform back to local for a smooth tween start (math shortcut here assumes we just tween local to original local safely, slight visual jump is acceptable, but we'll ease it).
        new TWEEN.Tween(group.position)
            .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 800)
            .easing(TWEEN.Easing.Quadratic.InOut)
            .start();

        new TWEEN.Tween(group.rotation)
            .to({ x: targetRot.x, y: targetRot.y, z: targetRot.z }, 800)
            .easing(TWEEN.Easing.Quadratic.InOut)
            .onComplete(() => {
                currentDrawnCard = null;
                isCarouselActive = true;
                
                document.getElementById('ui-title').innerText = "The Emotion Helix";
                document.getElementById('ui-instruction').innerHTML = "1. 将手悬停在旋转的卡牌带上<br>2. 拇指与食指捏合 抓取情绪";
                document.getElementById('ui-layer').style.transform = "translateX(-50%) translateY(0)";
            })
            .start();
    }

    // --- 3. Computer Vision / Hand Pinch Interaction ---
    function initMediaPipe() {
        const videoElement = document.getElementById('video-element');
        const cursor = document.getElementById('hand-cursor');
        
        let lastFrameTime = 0;

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        hands.setOptions({
            maxNumHands: 1, 
            modelComplexity: 0, 
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const indexTip = results.multiHandLandmarks[0][8];
                const thumbTip = results.multiHandLandmarks[0][4]; 
                
                // Track midpoint of pinch for precision
                const midX = (indexTip.x + thumbTip.x) / 2;
                const midY = (indexTip.y + thumbTip.y) / 2;

                const screenX = (1 - midX) * window.innerWidth; 
                const screenY = midY * window.innerHeight;

                cursor.style.display = 'block';
                cursor.style.left = screenX + 'px';
                cursor.style.top = screenY + 'px';

                // Calculate pinch distance (un-normalized to canvas ratio roughly)
                const dx = indexTip.x - thumbTip.x;
                const dy = indexTip.y - thumbTip.y;
                const pinchDist = Math.sqrt(dx*dx + dy*dy);

                // Threshold for pinch (~0.06 is good for stable grabbing)
                const isPinching = pinchDist < 0.06;

                if (isPinching) {
                    cursor.classList.add('grabbing');
                } else {
                    cursor.classList.remove('grabbing');
                }

                // Throttle raycasting for slight 3D performance gain
                const now = Date.now();
                if (now - lastFrameTime > 50) {
                    processInteractionRay(screenX, screenY, isPinching);
                    lastFrameTime = now;
                }

            } else {
                cursor.style.display = 'none';
            }
        });

        const cam = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        
        cam.start().then(() => {
            document.getElementById('loading').style.display = 'none';
        });
    }

    // Init All
    initThree();
    animateThree();
    initMediaPipe();

</script>
</body>
</html>
