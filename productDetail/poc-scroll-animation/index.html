<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll-Driven Animation POC</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="scroller">
    <!-- Mock Header -->
    <header class="page-header">
      <h1>Two-Tier <span>Scroll System</span></h1>
      <p>组内自由滑动 · 组间弹簧吸附</p>
      <div class="scroll-indicator">
        <div class="mouse"></div>
        <p>向下滚动探索</p>
      </div>
    </header>

    <!-- Outer Track acting as Group Swiper -->
    <main id="outer-track" class="outer-track"></main>
  </div>

  <!-- Global Progress Bar for visual feedback -->
  <div id="progress-bar"></div>

  <script src="ScrollAnimator.js"></script>
  <script src="main.js"></script>

</body>
</html>
