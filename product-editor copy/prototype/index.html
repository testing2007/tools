<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 详情页生成器 - 多风格一键生成</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --gray-900: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
        }

        /* ========== 顶部导航 ========== */
        .navbar {
            background: #fff;
            border-bottom: 1px solid var(--gray-200);
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        /* ========== 主布局 ========== */
        .app {
            display: flex;
            margin-top: 60px;
            height: calc(100vh - 60px);
        }

        /* ========== 左侧：输入面板 ========== */
        .input-panel {
            width: 380px;
            background: #fff;
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--gray-100);
        }

        .panel-header h2 {
            font-size: 16px;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .form-section {
            margin-bottom: 24px;
        }

        .form-section label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: var(--gray-600);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-section input,
        .form-section textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-section input:focus,
        .form-section textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-section textarea {
            min-height: 80px;
            resize: vertical;
        }

        /* 产品图上传 */
        .upload-zone {
            border: 2px dashed var(--gray-300);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--gray-50);
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: #f0f0ff;
        }

        .upload-zone.has-image {
            padding: 10px;
            border-style: solid;
        }

        .upload-zone input { display: none; }

        .upload-zone .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-zone p {
            color: var(--gray-600);
            font-size: 14px;
        }

        .upload-zone img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }

        /* 风格选择 */
        .style-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .style-option {
            padding: 12px 8px;
            border: 2px solid var(--gray-200);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }

        .style-option:hover {
            border-color: var(--primary);
        }

        .style-option.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%);
        }

        .style-option .icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .style-option .name {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-800);
        }

        /* 生成按钮 */
        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
            color: #fff;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: #fff;
            border: 1px solid var(--gray-200);
            color: var(--gray-600);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        /* ========== 右侧：预览区 ========== */
        .preview-panel {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: var(--gray-100);
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .preview-header h2 {
            font-size: 18px;
            color: var(--gray-800);
        }

        .preview-actions {
            display: flex;
            gap: 10px;
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
        }

        .empty-state .icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 20px;
            color: var(--gray-600);
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--gray-400);
            font-size: 14px;
        }

        /* 生成结果网格 */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .result-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            position: relative;
        }

        .result-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .result-card .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 10;
        }

        .result-card .badge.recommended {
            background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
        }

        .result-preview {
            height: 400px;
            overflow: hidden;
            position: relative;
        }

        .result-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        .result-preview .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.6) 100%);
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 20px;
        }

        .result-card:hover .overlay {
            opacity: 1;
        }

        .overlay-actions {
            display: flex;
            gap: 10px;
        }

        .overlay-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .overlay-actions button:hover {
            transform: scale(1.05);
        }

        .btn-edit {
            background: #fff;
            color: var(--gray-800);
        }

        .btn-download {
            background: var(--success);
            color: #fff;
        }

        .result-info {
            padding: 16px;
            border-top: 1px solid var(--gray-100);
        }

        .result-info h4 {
            font-size: 15px;
            color: var(--gray-800);
            margin-bottom: 4px;
        }

        .result-info p {
            font-size: 13px;
            color: var(--gray-500);
        }

        /* ========== 编辑模态框 ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 16px;
            max-width: 1400px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            overflow: hidden;
        }

        .modal-sidebar {
            width: 300px;
            background: var(--gray-50);
            border-right: 1px solid var(--gray-200);
            padding: 20px;
            overflow-y: auto;
        }

        .modal-sidebar h3 {
            font-size: 14px;
            color: var(--gray-600);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 18px;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--gray-100);
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--gray-200);
        }

        .modal-canvas {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
            background: var(--gray-100);
            border-radius: 12px;
            padding: 20px;
        }

        .editable-preview {
            width: 600px;
            background: #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--gray-800);
            color: #fff;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { background: var(--success); }
        .toast.warning { background: var(--warning); }

        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 进度条 */
        .progress-bar {
            height: 4px;
            background: var(--gray-200);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, #a855f7 100%);
            width: 0%;
            transition: width 0.3s;
        }

        /* 标签 */
        .tags-input {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            min-height: 50px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%);
            border-radius: 20px;
            font-size: 13px;
            color: var(--primary-dark);
        }

        .tag button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray-400);
            font-size: 16px;
        }

        .tag button:hover {
            color: var(--gray-600);
        }

        .tags-input input {
            border: none;
            outline: none;
            flex: 1;
            min-width: 100px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="logo">
            <span>🎨</span>
            <span>AI 详情页生成器</span>
        </div>
        <div class="nav-actions">
            <button class="btn btn-outline" onclick="showToast('历史记录功能开发中')">📁 历史记录</button>
            <button class="btn btn-outline" onclick="showToast('模板市场功能开发中')">🏪 模板市场</button>
        </div>
    </nav>

    <div class="app">
        <!-- 左侧输入面板 -->
        <aside class="input-panel">
            <div class="panel-header">
                <h2>📋 产品信息</h2>
            </div>
            <div class="panel-body">
                <!-- 产品图上传 -->
                <div class="form-section">
                    <label>产品主图 *</label>
                    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('productImage').click()">
                        <input type="file" id="productImage" accept="image/*" onchange="handleImageUpload(this)">
                        <div class="icon">📦</div>
                        <p>点击上传产品图片<br><small style="color: #999;">支持 PNG、JPG，建议 800×800 以上</small></p>
                    </div>
                </div>

                <!-- 产品名称 -->
                <div class="form-section">
                    <label>产品名称 *</label>
                    <input type="text" id="productName" placeholder="例如：法布朗庄园干红葡萄酒" value="法布朗庄园干红葡萄酒">
                </div>

                <!-- 产品卖点 -->
                <div class="form-section">
                    <label>产品卖点（回车添加）</label>
                    <div class="tags-input" id="tagsInput">
                        <span class="tag">波尔多产区 <button onclick="removeTag(this)">×</button></span>
                        <span class="tag">橡木桶陈酿 <button onclick="removeTag(this)">×</button></span>
                        <span class="tag">醇厚口感 <button onclick="removeTag(this)">×</button></span>
                        <input type="text" placeholder="添加卖点..." onkeydown="handleTagInput(event)">
                    </div>
                </div>

                <!-- 产品描述 -->
                <div class="form-section">
                    <label>产品描述</label>
                    <textarea id="productDesc" placeholder="详细描述产品特点、功效、适用人群等...">源自法国波尔多核心产区，精选赤霞珠与美乐葡萄混酿。经橡木桶陈酿18个月，酒体呈深宝石红色，散发浓郁果香与香草气息。适合搭配牛排、羊排等红肉。</textarea>
                </div>

                <!-- 风格选择 -->
                <div class="form-section">
                    <label>设计风格</label>
                    <div class="style-grid">
                        <div class="style-option active" data-style="luxury" onclick="selectStyle(this)">
                            <div class="icon">👑</div>
                            <div class="name">奢华</div>
                        </div>
                        <div class="style-option" data-style="minimal" onclick="selectStyle(this)">
                            <div class="icon">✨</div>
                            <div class="name">简约</div>
                        </div>
                        <div class="style-option" data-style="fresh" onclick="selectStyle(this)">
                            <div class="icon">🌿</div>
                            <div class="name">清新</div>
                        </div>
                        <div class="style-option" data-style="vintage" onclick="selectStyle(this)">
                            <div class="icon">📜</div>
                            <div class="name">复古</div>
                        </div>
                        <div class="style-option" data-style="tech" onclick="selectStyle(this)">
                            <div class="icon">🔮</div>
                            <div class="name">科技</div>
                        </div>
                        <div class="style-option" data-style="warm" onclick="selectStyle(this)">
                            <div class="icon">🔥</div>
                            <div class="name">温暖</div>
                        </div>
                    </div>
                </div>

                <!-- 生成按钮 -->
                <button class="btn btn-primary" id="generateBtn" onclick="generateDesigns()">
                    <span>✨</span>
                    <span>AI 一键生成 6 种风格</span>
                </button>
                <div class="progress-bar" id="progressBar" style="display: none;">
                    <div class="fill" id="progressFill"></div>
                </div>
            </div>
        </aside>

        <!-- 右侧预览区 -->
        <main class="preview-panel">
            <div class="preview-header">
                <h2>🖼️ 生成结果</h2>
                <div class="preview-actions" id="previewActions" style="display: none;">
                    <button class="btn btn-outline" onclick="downloadAll()">📥 批量下载</button>
                    <button class="btn btn-success" onclick="regenerate()">🔄 重新生成</button>
                </div>
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState">
                <div class="icon">🎨</div>
                <h3>填写产品信息，一键生成多风格详情页</h3>
                <p>AI 将根据您的产品信息自动生成 6 种不同风格的设计</p>
            </div>

            <!-- 结果网格 -->
            <div class="results-grid" id="resultsGrid" style="display: none;"></div>
        </main>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-sidebar">
                <h3>文字内容</h3>
                <div class="form-section">
                    <label>主标题</label>
                    <input type="text" id="editTitle" onchange="updatePreview()">
                </div>
                <div class="form-section">
                    <label>副标题</label>
                    <input type="text" id="editSubtitle" onchange="updatePreview()">
                </div>
                <div class="form-section">
                    <label>产品描述</label>
                    <textarea id="editDesc" rows="4" onchange="updatePreview()"></textarea>
                </div>
                <h3 style="margin-top: 20px;">导出尺寸</h3>
                <div class="form-section">
                    <button class="btn btn-outline" style="width: 100%; margin-bottom: 8px;" onclick="exportSize('taobao')">📱 淘宝/天猫 (750×∞)</button>
                    <button class="btn btn-outline" style="width: 100%; margin-bottom: 8px;" onclick="exportSize('jd')">🛒 京东 (990×∞)</button>
                    <button class="btn btn-outline" style="width: 100%;" onclick="exportSize('wechat')">💬 微信小程序 (750×∞)</button>
                </div>
            </div>
            <div class="modal-main">
                <div class="modal-header">
                    <h2>编辑详情页</h2>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-canvas">
                    <div class="editable-preview" id="editablePreview"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== 全局状态 ==========
        let productImageData = null;
        let selectedStyles = ['luxury'];
        let generatedDesigns = [];
        let currentEditIndex = -1;

        // ========== 工具函数 ==========
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        // ========== 图片上传 ==========
        function handleImageUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    productImageData = e.target.result;
                    const zone = document.getElementById('uploadZone');
                    zone.innerHTML = `<input type="file" id="productImage" accept="image/*" onchange="handleImageUpload(this)"><img src="${e.target.result}" alt="product">`;
                    zone.classList.add('has-image');
                    showToast('✅ 产品图上传成功', 'success');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // ========== 标签管理 ==========
        function handleTagInput(event) {
            if (event.key === 'Enter' && event.target.value.trim()) {
                const container = document.getElementById('tagsInput');
                const input = event.target;
                const tag = document.createElement('span');
                tag.className = 'tag';
                tag.innerHTML = `${input.value} <button onclick="removeTag(this)">×</button>`;
                container.insertBefore(tag, input);
                input.value = '';
            }
        }

        function removeTag(btn) {
            btn.parentElement.remove();
        }

        function getTags() {
            const tags = document.querySelectorAll('#tagsInput .tag');
            return Array.from(tags).map(t => t.textContent.replace('×', '').trim());
        }

        // ========== 风格选择 ==========
        function selectStyle(el) {
            document.querySelectorAll('.style-option').forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
            selectedStyles = [el.dataset.style];
        }

        // ========== AI 生成设计 ==========
        async function generateDesigns() {
            const name = document.getElementById('productName').value.trim();
            const desc = document.getElementById('productDesc').value.trim();
            const tags = getTags();

            if (!name) {
                showToast('⚠️ 请输入产品名称', 'warning');
                return;
            }

            // 显示进度
            const btn = document.getElementById('generateBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span><span>AI 正在生成...</span>';
            progressBar.style.display = 'block';

            // 模拟生成过程
            const styles = [
                { id: 'luxury', name: '奢华风格', desc: '高端大气，适合精品定位', recommended: true },
                { id: 'minimal', name: '简约风格', desc: '干净清爽，突出产品本身', recommended: false },
                { id: 'fresh', name: '清新风格', desc: '自然活力，适合年轻群体', recommended: false },
                { id: 'vintage', name: '复古风格', desc: '经典怀旧，彰显品质历史', recommended: true },
                { id: 'tech', name: '科技风格', desc: '现代前卫，适合科技产品', recommended: false },
                { id: 'warm', name: '温暖风格', desc: '亲切温馨，适合家居食品', recommended: false }
            ];

            generatedDesigns = [];
            
            for (let i = 0; i < styles.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 500));
                progressFill.style.width = ((i + 1) / styles.length * 100) + '%';
                
                generatedDesigns.push({
                    ...styles[i],
                    productName: name,
                    productDesc: desc,
                    tags: tags,
                    productImage: productImageData
                });
            }

            // 显示结果
            renderResults();
            
            btn.disabled = false;
            btn.innerHTML = '<span>✨</span><span>AI 一键生成 6 种风格</span>';
            progressBar.style.display = 'none';
            progressFill.style.width = '0%';

            showToast('✅ 6 种风格生成完成！', 'success');
        }

        // ========== 渲染结果 ==========
        function renderResults() {
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('resultsGrid').style.display = 'grid';
            document.getElementById('previewActions').style.display = 'flex';

            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = generatedDesigns.map((design, index) => `
                <div class="result-card">
                    <span class="badge ${design.recommended ? 'recommended' : ''}">${design.recommended ? '🎯 AI 推荐' : design.name}</span>
                    <div class="result-preview">
                        ${generatePreviewHTML(design, index)}
                        <div class="overlay">
                            <div class="overlay-actions">
                                <button class="btn-edit" onclick="openEditor(${index})">✏️ 编辑</button>
                                <button class="btn-download" onclick="downloadDesign(${index})">📥 下载</button>
                            </div>
                        </div>
                    </div>
                    <div class="result-info">
                        <h4>${design.name}</h4>
                        <p>${design.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        // ========== 生成预览 HTML ==========
        function generatePreviewHTML(design, index) {
            const styleConfigs = {
                luxury: { bg: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)', textColor: '#fff', accent: '#d4af37' },
                minimal: { bg: '#ffffff', textColor: '#333', accent: '#666' },
                fresh: { bg: 'linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%)', textColor: '#006064', accent: '#00838f' },
                vintage: { bg: 'linear-gradient(135deg, #3e2723 0%, #5d4037 100%)', textColor: '#efebe9', accent: '#bcaaa4' },
                tech: { bg: 'linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%)', textColor: '#fff', accent: '#00d9ff' },
                warm: { bg: 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)', textColor: '#5d4037', accent: '#ff6b6b' }
            };

            const config = styleConfigs[design.id] || styleConfigs.luxury;
            const productImg = design.productImage || 'assets/hero_v2.png';

            return `
                <div id="preview-${index}" style="width: 100%; height: 100%; background: ${config.bg}; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; color: ${config.textColor};">
                    <div style="width: 180px; height: 180px; background: rgba(255,255,255,0.1); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; overflow: hidden;">
                        <img src="${productImg}" style="max-width: 90%; max-height: 90%; object-fit: contain;">
                    </div>
                    <h3 style="font-size: 22px; margin-bottom: 10px; text-align: center;">${design.productName}</h3>
                    <p style="font-size: 13px; opacity: 0.8; text-align: center; max-width: 260px; line-height: 1.6;">${design.tags.slice(0, 3).join(' · ')}</p>
                    <div style="margin-top: 15px; display: flex; gap: 8px;">
                        ${design.tags.slice(0, 2).map(tag => `<span style="padding: 4px 10px; background: ${config.accent}; border-radius: 12px; font-size: 11px;">${tag}</span>`).join('')}
                    </div>
                </div>
            `;
        }

        // ========== 打开编辑器 ==========
        function openEditor(index) {
            currentEditIndex = index;
            const design = generatedDesigns[index];
            
            document.getElementById('editTitle').value = design.productName;
            document.getElementById('editSubtitle').value = design.tags.join(' · ');
            document.getElementById('editDesc').value = design.productDesc;
            
            updatePreview();
            document.getElementById('editModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        function updatePreview() {
            if (currentEditIndex < 0) return;
            
            const design = generatedDesigns[currentEditIndex];
            const title = document.getElementById('editTitle').value;
            const subtitle = document.getElementById('editSubtitle').value;
            const desc = document.getElementById('editDesc').value;
            const productImg = design.productImage || 'assets/hero_v2.png';

            document.getElementById('editablePreview').innerHTML = `
                <div style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 40px; min-height: 800px;">
                    <!-- Hero -->
                    <div style="text-align: center; padding: 60px 0;">
                        <div style="width: 300px; height: 300px; margin: 0 auto 30px; background: rgba(255,255,255,0.1); border-radius: 20px; display: flex; align-items: center; justify-content: center;">
                            <img src="${productImg}" style="max-width: 90%; max-height: 90%; object-fit: contain;">
                        </div>
                        <h1 style="color: #fff; font-size: 36px; margin-bottom: 15px;" contenteditable="true">${title}</h1>
                        <p style="color: #d4af37; font-size: 18px;" contenteditable="true">${subtitle}</p>
                    </div>
                    
                    <!-- 描述 -->
                    <div style="background: rgba(255,255,255,0.05); padding: 40px; border-radius: 16px; margin: 20px 0;">
                        <h2 style="color: #d4af37; font-size: 24px; margin-bottom: 20px; text-align: center;">产品介绍</h2>
                        <p style="color: #fff; font-size: 16px; line-height: 2; text-align: center;" contenteditable="true">${desc}</p>
                    </div>
                    
                    <!-- 卖点 -->
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0;">
                        <div style="background: rgba(212,175,55,0.1); padding: 30px; border-radius: 12px; text-align: center;">
                            <div style="font-size: 40px; margin-bottom: 10px;">🍇</div>
                            <h4 style="color: #d4af37; margin-bottom: 8px;" contenteditable="true">精选原料</h4>
                            <p style="color: #aaa; font-size: 13px;" contenteditable="true">波尔多核心产区</p>
                        </div>
                        <div style="background: rgba(212,175,55,0.1); padding: 30px; border-radius: 12px; text-align: center;">
                            <div style="font-size: 40px; margin-bottom: 10px;">🪵</div>
                            <h4 style="color: #d4af37; margin-bottom: 8px;" contenteditable="true">橡木陈酿</h4>
                            <p style="color: #aaa; font-size: 13px;" contenteditable="true">18个月精心陈酿</p>
                        </div>
                        <div style="background: rgba(212,175,55,0.1); padding: 30px; border-radius: 12px; text-align: center;">
                            <div style="font-size: 40px; margin-bottom: 10px;">🏆</div>
                            <h4 style="color: #d4af37; margin-bottom: 8px;" contenteditable="true">品质保证</h4>
                            <p style="color: #aaa; font-size: 13px;" contenteditable="true">原瓶进口认证</p>
                        </div>
                    </div>
                    
                    <!-- 底部 -->
                    <div style="text-align: center; padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.1);">
                        <p style="color: #666; font-size: 14px; letter-spacing: 4px;">精品生活 · 品质之选</p>
                    </div>
                </div>
            `;
        }

        // ========== 导出功能 ==========
        async function downloadDesign(index) {
            const element = document.getElementById(`preview-${index}`);
            if (!element) return;

            showToast('⏳ 正在生成图片...');
            
            try {
                const canvas = await html2canvas(element, { scale: 2, useCORS: true, allowTaint: true });
                const link = document.createElement('a');
                link.download = `design-${generatedDesigns[index].id}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
                showToast('✅ 下载成功', 'success');
            } catch (err) {
                console.error(err);
                showToast('❌ 下载失败', 'warning');
            }
        }

        async function downloadAll() {
            showToast('⏳ 正在批量生成...');
            for (let i = 0; i < generatedDesigns.length; i++) {
                await downloadDesign(i);
                await new Promise(r => setTimeout(r, 500));
            }
            showToast('✅ 批量下载完成', 'success');
        }

        function exportSize(platform) {
            showToast(`📤 导出 ${platform} 尺寸功能开发中...`);
        }

        function regenerate() {
            generateDesigns();
        }
    </script>
</body>
</html>
