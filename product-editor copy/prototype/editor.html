<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 详情页编辑器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            overflow: hidden;
        }

        /* ========== 顶部工具栏 ========== */
        .toolbar {
            height: 50px;
            background: #fff;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 12px;
            border-right: 1px solid var(--gray-200);
        }

        .toolbar-group:last-child {
            border-right: none;
        }

        .toolbar-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            position: relative;
        }

        .toolbar-btn:hover {
            background: var(--gray-100);
        }

        .toolbar-btn.active {
            background: var(--primary);
            color: #fff;
        }

        .toolbar-btn[title]:hover::after {
            content: attr(title);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gray-800);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 100;
        }

        .toolbar-text-btn {
            height: 36px;
            padding: 0 12px;
            border: 1px solid var(--gray-200);
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .toolbar-text-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .toolbar-text-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .toolbar-text-btn.primary:hover {
            background: var(--primary-dark);
        }

        .spacer { flex: 1; }

        .logo {
            font-weight: 700;
            color: var(--primary);
            font-size: 16px;
            margin-right: 20px;
        }

        /* ========== 主布局 ========== */
        .main {
            display: flex;
            height: calc(100vh - 50px);
        }

        /* ========== 左侧工具栏 ========== */
        .left-panel {
            width: 60px;
            background: #fff;
            border-right: 1px solid var(--gray-200);
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tool-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.15s;
        }

        .tool-btn span {
            font-size: 9px;
            color: var(--gray-500);
        }

        .tool-btn:hover {
            background: var(--gray-100);
        }

        .tool-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
            color: #fff;
        }

        .tool-btn.active span {
            color: rgba(255,255,255,0.8);
        }

        /* ========== 画布区域 ========== */
        .canvas-area {
            flex: 1;
            background: var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 40px;
        }

        .canvas-wrapper {
            background: #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        /* ========== 右侧属性面板 ========== */
        .right-panel {
            width: 280px;
            background: #fff;
            border-left: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
        }

        .panel-section {
            padding: 16px;
            border-bottom: 1px solid var(--gray-100);
        }

        .panel-section h3 {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .prop-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .prop-row label {
            width: 50px;
            font-size: 12px;
            color: var(--gray-600);
        }

        .prop-row input, .prop-row select {
            flex: 1;
            height: 32px;
            padding: 0 10px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            font-size: 13px;
        }

        .prop-row input:focus, .prop-row select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .prop-row-half {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .prop-input-group {
            display: flex;
            align-items: center;
        }

        .prop-input-group label {
            width: 24px;
            font-size: 12px;
            color: var(--gray-500);
        }

        .prop-input-group input {
            flex: 1;
            height: 32px;
            padding: 0 8px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            font-size: 13px;
            width: 60px;
        }

        .color-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-input input[type="color"] {
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            cursor: pointer;
        }

        .color-input input[type="text"] {
            flex: 1;
        }

        /* ========== 图层面板 ========== */
        .layers-panel {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .layers-panel h3 {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: var(--gray-50);
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.15s;
            border: 2px solid transparent;
        }

        .layer-item:hover {
            background: var(--gray-100);
        }

        .layer-item.active {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .layer-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-right: 10px;
        }

        .layer-name {
            flex: 1;
            font-size: 13px;
            color: var(--gray-700);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .layer-actions {
            display: flex;
            gap: 4px;
        }

        .layer-action-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            opacity: 0.5;
        }

        .layer-action-btn:hover {
            background: var(--gray-200);
            opacity: 1;
        }

        /* ========== Toast ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--gray-800);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { background: var(--success); }

        /* ========== 模态框 ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            min-width: 400px;
            max-width: 600px;
        }

        .modal h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .modal textarea {
            width: 100%;
            height: 300px;
            padding: 12px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 12px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        /* 隐藏文件输入 */
        .hidden-input { display: none; }
    </style>
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="logo">🎨 JSON 编辑器</div>
        
        <div class="toolbar-group">
            <button class="toolbar-btn" title="新建" onclick="newProject()">📄</button>
            <button class="toolbar-btn" title="打开JSON" onclick="document.getElementById('jsonFileInput').click()">📂</button>
            <button class="toolbar-btn" title="保存JSON" onclick="saveProject()">💾</button>
        </div>

        <div class="toolbar-group">
            <button class="toolbar-btn" title="撤销 Ctrl+Z" onclick="undo()">↩️</button>
            <button class="toolbar-btn" title="重做 Ctrl+Y" onclick="redo()">↪️</button>
        </div>

        <div class="toolbar-group">
            <button class="toolbar-btn" title="删除选中" onclick="deleteSelected()">🗑️</button>
            <button class="toolbar-btn" title="复制" onclick="copySelected()">📋</button>
            <button class="toolbar-btn" title="粘贴" onclick="pasteClipboard()">📌</button>
        </div>

        <div class="toolbar-group">
            <button class="toolbar-btn" title="置顶" onclick="bringToFront()">⬆️</button>
            <button class="toolbar-btn" title="置底" onclick="sendToBack()">⬇️</button>
        </div>

        <div class="spacer"></div>

        <button class="toolbar-text-btn" onclick="showProductsModal()">
            📂 产品库
        </button>
        <button class="toolbar-text-btn" onclick="showAiModal()">
            🤖 AI生成
        </button>
        <button class="toolbar-text-btn" onclick="showPexelsModal()">
            🖼️ 搜图
        </button>
        <button class="toolbar-text-btn" onclick="showJsonModal()">
            📝 JSON
        </button>
        <button class="toolbar-text-btn primary" onclick="exportImage()">
            📥 导出
        </button>
    </div>

    <div class="main">
        <!-- 左侧工具 -->
        <div class="left-panel">
            <button class="tool-btn active" data-tool="select" onclick="setTool('select')">
                🖱️<span>选择</span>
            </button>
            <button class="tool-btn" data-tool="text" onclick="addText()">
                📝<span>文字</span>
            </button>
            <button class="tool-btn" data-tool="image" onclick="document.getElementById('imageInput').click()">
                🖼️<span>图片</span>
            </button>
            <button class="tool-btn" data-tool="rect" onclick="addRect()">
                ⬜<span>矩形</span>
            </button>
            <button class="tool-btn" data-tool="circle" onclick="addCircle()">
                ⭕<span>圆形</span>
            </button>
            <button class="tool-btn" data-tool="line" onclick="addLine()">
                ➖<span>线条</span>
            </button>
        </div>

        <!-- 画布区域 -->
        <div class="canvas-area">
            <div class="canvas-wrapper">
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <!-- 右侧属性面板 -->
        <div class="right-panel">
            <div class="panel-section">
                <h3>位置与尺寸</h3>
                <div class="prop-row-half">
                    <div class="prop-input-group">
                        <label>X</label>
                        <input type="number" id="propX" onchange="updateSelectedProp('left', this.value)">
                    </div>
                    <div class="prop-input-group">
                        <label>Y</label>
                        <input type="number" id="propY" onchange="updateSelectedProp('top', this.value)">
                    </div>
                </div>
                <div class="prop-row-half">
                    <div class="prop-input-group">
                        <label>W</label>
                        <input type="number" id="propW" onchange="updateSelectedWidth(this.value)">
                    </div>
                    <div class="prop-input-group">
                        <label>H</label>
                        <input type="number" id="propH" onchange="updateSelectedHeight(this.value)">
                    </div>
                </div>
                <div class="prop-row">
                    <label>旋转</label>
                    <input type="number" id="propAngle" onchange="updateSelectedProp('angle', this.value)" style="width: 80px;">
                    <span style="margin-left: 4px; color: var(--gray-500);">°</span>
                </div>
            </div>

            <div class="panel-section" id="textProps" style="display: none;">
                <h3>文字属性</h3>
                <div class="prop-row">
                    <label>内容</label>
                    <input type="text" id="propText" onchange="updateSelectedProp('text', this.value)">
                </div>
                <div class="prop-row">
                    <label>字号</label>
                    <input type="number" id="propFontSize" onchange="updateSelectedProp('fontSize', this.value)" style="width: 80px;">
                </div>
                <div class="prop-row">
                    <label>颜色</label>
                    <div class="color-input">
                        <input type="color" id="propFill" onchange="updateSelectedProp('fill', this.value)">
                        <input type="text" id="propFillText" onchange="updateSelectedProp('fill', this.value)">
                    </div>
                </div>
            </div>

            <div class="panel-section" id="shapeProps" style="display: none;">
                <h3>形状属性</h3>
                <div class="prop-row">
                    <label>填充</label>
                    <div class="color-input">
                        <input type="color" id="propShapeFill" onchange="updateSelectedProp('fill', this.value)">
                        <input type="text" id="propShapeFillText" onchange="updateSelectedProp('fill', this.value)">
                    </div>
                </div>
                <div class="prop-row">
                    <label>边框</label>
                    <div class="color-input">
                        <input type="color" id="propStroke" onchange="updateSelectedProp('stroke', this.value)">
                        <input type="text" id="propStrokeText" onchange="updateSelectedProp('stroke', this.value)">
                    </div>
                </div>
                <div class="prop-row">
                    <label>边框宽</label>
                    <input type="number" id="propStrokeWidth" onchange="updateSelectedProp('strokeWidth', this.value)" style="width: 80px;">
                </div>
            </div>

            <div class="layers-panel">
                <h3>图层列表</h3>
                <div id="layersList"></div>
            </div>
        </div>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="jsonFileInput" class="hidden-input" accept=".json" onchange="loadJsonFile(this)">
    <input type="file" id="imageInput" class="hidden-input" accept="image/*" onchange="addImage(this)">

    <!-- JSON 模态框 -->
    <div class="modal-overlay" id="jsonModal">
        <div class="modal">
            <h2>项目 JSON</h2>
            <textarea id="jsonContent" readonly></textarea>
            <div class="modal-actions">
                <button class="toolbar-text-btn" onclick="copyJson()">📋 复制</button>
                <button class="toolbar-text-btn" onclick="closeJsonModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- AI 生成模态框 -->
    <div class="modal-overlay" id="aiModal">
        <div class="modal" style="max-width: 500px;">
            <h2>🤖 AI 生成布局</h2>
            <div style="margin-bottom: 12px;">
                <label style="display: block; font-size: 13px; color: #666; margin-bottom: 6px;">产品名称</label>
                <input type="text" id="aiProductName" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px;" placeholder="例如：法布朗红酒" value="法布朗红酒">
            </div>
            <div style="margin-bottom: 12px;">
                <label style="display: block; font-size: 13px; color: #666; margin-bottom: 6px;">产品卖点（用逗号分隔）</label>
                <input type="text" id="aiProductFeatures" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px;" placeholder="波尔多产区, 橡木陈酿, 醇厚口感" value="波尔多产区, 橡木陈酿, 醇厚口感">
            </div>
            <div style="margin-bottom: 12px;">
                <label style="display: block; font-size: 13px; color: #666; margin-bottom: 6px;">设计风格</label>
                <select id="aiStyle" style="width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px;">
                    <option value="luxury">奢华高端</option>
                    <option value="minimal">简约现代</option>
                    <option value="fresh">清新自然</option>
                    <option value="vintage">复古经典</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="toolbar-text-btn" onclick="closeAiModal()">取消</button>
                <button class="toolbar-text-btn primary" onclick="generateWithAi()" id="aiGenBtn">✨ 生成</button>
            </div>
        </div>
    </div>

    <!-- Pexels 搜图模态框 -->
    <div class="modal-overlay" id="pexelsModal">
        <div class="modal" style="max-width: 800px;">
            <h2>🖼️ 搜索免费图片 (Pexels)</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <input type="text" id="pexelsQuery" style="flex: 1; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px;" placeholder="输入搜索关键词（英文效果更好）" value="red wine dark">
                <button class="toolbar-text-btn primary" onclick="searchPexels()">🔍 搜索</button>
            </div>
            <div id="pexelsResults" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-height: 400px; overflow-y: auto;">
                <div style="grid-column: span 4; text-align: center; color: #999; padding: 40px;">输入关键词后点击搜索</div>
            </div>
            <div class="modal-actions">
                <button class="toolbar-text-btn" onclick="closePexelsModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 产品库模态框 -->
    <div class="modal-overlay" id="productsModal">
        <div class="modal" style="max-width: 900px; max-height: 85vh; display: flex; flex-direction: column;">
            <h2>📂 产品库 - HTML 详情页</h2>
            <div style="display: flex; gap: 20px; flex: 1; overflow: hidden;">
                <!-- 左侧产品列表 -->
                <div style="width: 200px; border-right: 1px solid #e5e7eb; padding-right: 20px;">
                    <h3 style="font-size: 13px; color: #666; margin-bottom: 12px;">产品列表</h3>
                    <div id="productsList">
                        <div class="product-item active" data-product="fabrang-wine" onclick="selectProduct('fabrang-wine')">
                            🍷 法布朗红酒
                        </div>
                        <div class="product-item" data-product="swan-legend" onclick="selectProduct('swan-legend')">
                            🦢 法布朗传奇
                        </div>
                    </div>
                    <button class="toolbar-text-btn" style="width: 100%; margin-top: 16px;" onclick="previewProduct()">
                        👁️ 预览HTML
                    </button>
                </div>
                <!-- 右侧预览区 -->
                <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                    <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                        <button class="toolbar-text-btn primary" onclick="loadProductAsJson()">📥 转换为JSON并加载</button>
                        <button class="toolbar-text-btn" onclick="showProductJson()">📋 查看JSON</button>
                    </div>
                    <div id="productPreview" style="flex: 1; background: #f5f5f5; border-radius: 8px; overflow: auto; padding: 10px;">
                        <iframe id="productFrame" style="width: 100%; height: 600px; border: none; background: #fff; transform-origin: top left; transform: scale(0.5);"></iframe>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="toolbar-text-btn" onclick="closeProductsModal()">关闭</button>
            </div>
        </div>
    </div>

    <style>
        .product-item {
            padding: 12px 16px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s;
            border: 2px solid transparent;
        }
        .product-item:hover {
            background: #f3f4f6;
        }
        .product-item.active {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
        }
    </style>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== 全局变量 ==========
        let canvas;
        let clipboard = null;
        let history = [];
        let historyIndex = -1;
        const maxHistory = 50;

        // ========== 初始化 ==========
        window.onload = function() {
            canvas = new fabric.Canvas('canvas', {
                width: 600,
                height: 900,
                backgroundColor: '#ffffff',
                selection: true,
                preserveObjectStacking: true
            });

            // 事件监听
            canvas.on('selection:created', onSelectionChanged);
            canvas.on('selection:updated', onSelectionChanged);
            canvas.on('selection:cleared', onSelectionCleared);
            canvas.on('object:modified', onObjectModified);
            canvas.on('object:added', saveHistory);

            // 键盘快捷键
            document.addEventListener('keydown', handleKeyboard);

            // 加载模拟模板
            loadMockTemplate();
        };

        // ========== 模拟模板数据 ==========
        const mockTemplate = {

        function loadFromJson(json) {
            canvas.clear();
            canvas.setWidth(json.width || 600);
            canvas.setHeight(json.height || 900);
            canvas.setBackgroundColor(json.background || '#ffffff', canvas.renderAll.bind(canvas));

            json.layers.forEach(layer => {

            });

            updateLayersList();
            saveHistory();

        function createObjectFromLayer(layer) {
            let obj;
            
            switch (layer.type) {
                case 'text':
                    obj = new fabric.IText(layer.content || '文字', {
                        left: layer.x || 0,
                        top: layer.y || 0,
                        fontSize: layer.fontSize || 20,
                        fontFamily: layer.fontFamily || 'PingFang SC',
                        fontWeight: layer.fontWeight || 'normal',
                        fill: layer.fill || '#000000',
                        textAlign: layer.textAlign || 'left',
                        originX: layer.originX || 'left',
                        originY: layer.originY || 'top',
                        lineHeight: layer.lineHeight || 1.4
                    });
                    break;
                    
                case 'rect':
                    obj = new fabric.Rect({
                        left: layer.x || 0,
                        top: layer.y || 0,
                        width: layer.width || 100,
                        height: layer.height || 100,
                        fill: layer.fill || '#cccccc',
                        stroke: layer.stroke || null,
                        strokeWidth: layer.strokeWidth || 0,
                        rx: layer.rx || 0,
                        ry: layer.ry || 0
                    });
                    break;

                case 'circle':
                    obj = new fabric.Circle({
                        left: layer.x || 0,
                        top: layer.y || 0,
                        radius: layer.radius || 50,
                        fill: layer.fill || '#cccccc',
                        stroke: layer.stroke || null,
                        strokeWidth: layer.strokeWidth || 0
                    });
                    break;
                    
                case 'line':
                    obj = new fabric.Line(layer.points || [0, 0, 100, 0], {
                        stroke: layer.stroke || '#000000',
                        strokeWidth: layer.strokeWidth || 1
                    });
                    break;
                    
                case 'image':
                    if (layer.src) {
                        fabric.Image.fromURL(layer.src, function(img) {
                            img.set({
                                left: layer.x || 0,
                                top: layer.y || 0,
                                scaleX: layer.width ? layer.width / img.width : 1,
                                scaleY: layer.height ? layer.height / img.height : 1,
                                customId: layer.id,
                                customName: layer.name
                            });
                            canvas.add(img);
                            updateLayersList();
                        });
                        return;
                    }
                    break;
            }

            if (obj) {
                obj.set({
                    customId: layer.id,
                    customName: layer.name || layer.type,
                    selectable: layer.selectable !== false,
                    angle: layer.rotation || 0,
                    opacity: layer.opacity || 1
                });
                canvas.add(obj);
            }
        }

        function updateLayersList() {

                const name = obj.customName || obj.type;
                const icon = getLayerIcon(obj.type);
                return `
                    <div class="layer-item" data-index="${objects.length - 1 - index}" onclick="selectLayer(${objects.length - 1 - index})">
                        <div class="layer-icon">${icon}</div>
                        <div class="layer-name">${name}</div>
                        <div class="layer-actions">
                            <button class="layer-action-btn" onclick="event.stopPropagation(); deleteLayerByIndex(${objects.length - 1 - index})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');

            const icons = {

                'rect': '⬜',

                'line': '➖',

            return icons[type] || '📦';

        function saveHistory() {
            const json = canvas.toJSON(['customId', 'customName', 'selectable']);
            history = history.slice(0, historyIndex + 1);
            history.push(JSON.stringify(json));
            if (history.length > maxHistory) history.shift();
            historyIndex = history.length - 1;
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                loadFromHistory();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                loadFromHistory();
            }
        }

        function loadFromHistory() {
            const json = JSON.parse(history[historyIndex]);
            canvas.loadFromJSON(json, function() {
                canvas.renderAll();
                updateLayersList();
            });

        function exportToJson() {
            const objects = canvas.getObjects();
            const layers = objects.map(obj => {
                const base = {
                    id: obj.customId || obj.type + '-' + Date.now(),
                    type: obj.type === 'i-text' ? 'text' : obj.type,
                    name: obj.customName || obj.type,
                    x: Math.round(obj.left),
                    y: Math.round(obj.top),
                    rotation: Math.round(obj.angle),
                    opacity: obj.opacity
                };

                if (obj.type === 'i-text') {
                    return {
                        ...base,
                        content: obj.text,
                        fontSize: obj.fontSize,
                        fontFamily: obj.fontFamily,
                        fontWeight: obj.fontWeight,
                        fill: obj.fill,
                        textAlign: obj.textAlign,
                        originX: obj.originX,
                        originY: obj.originY
                    };
                } else if (obj.type === 'rect') {
                    return {
                        ...base,
                        width: Math.round(obj.getScaledWidth()),
                        height: Math.round(obj.getScaledHeight()),
                        fill: obj.fill,
                        stroke: obj.stroke,
                        strokeWidth: obj.strokeWidth,
                        rx: obj.rx,
                        ry: obj.ry
                    };
                } else if (obj.type === 'circle') {
                    return {
                        ...base,
                        radius: Math.round(obj.getRadiusX()),
                        fill: obj.fill,
                        stroke: obj.stroke,
                        strokeWidth: obj.strokeWidth
                    };
                } else if (obj.type === 'line') {
                    return {
                        ...base,
                        points: [obj.x1, obj.y1, obj.x2, obj.y2],
                        stroke: obj.stroke,
                        strokeWidth: obj.strokeWidth
                    };
                } else if (obj.type === 'image') {
                    return {
                        ...base,
                        src: obj.getSrc(),
                        width: Math.round(obj.getScaledWidth()),
                        height: Math.round(obj.getScaledHeight())
                    };
                }
                return base;
            });

            return {
                version: "1.0",
                name: "我的项目",
                width: canvas.getWidth(),
                height: canvas.getHeight(),
                background: canvas.backgroundColor,
                layers: layers
            };
        }

        function handleKeyboard(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 'z':
                        e.preventDefault();
                        e.shiftKey ? redo() : undo();
                        break;
                    case 'y':
                        e.preventDefault();
                        redo();
                        break;
                    case 'c':
                        e.preventDefault();
                        copySelected();
                        break;
                    case 'v':
                        e.preventDefault();
                        pasteClipboard();
                        break;
                }
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                if (canvas.getActiveObject() && canvas.getActiveObject().type !== 'i-text') {
                    e.preventDefault();
                    deleteSelected();
                }
            }
        }

                const response = await fetch(DEEPSEEK_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                const content = data.choices[0].message.content;
                
                // 提取JSON
                const jsonMatch = content.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    const layoutJson = JSON.parse(jsonMatch[0]);
                    loadFromJson(layoutJson);
                    closeAiModal();
                    showToast('✅ AI 布局生成成功', 'success');
                } else {
                    throw new Error('无法解析AI返回的JSON');
                }
            } catch (err) {
                console.error('AI生成错误:', err);
                showToast('❌ 生成失败: ' + err.message);
            }

            btn.disabled = false;
            btn.textContent = '✨ 生成';
        }

        // ========== Pexels 搜图模态框 ==========
        function showPexelsModal() {
            document.getElementById('pexelsModal').classList.add('show');
        }

        function closePexelsModal() {
            document.getElementById('pexelsModal').classList.remove('show');
        }

        async function searchPexels() {
            const query = document.getElementById('pexelsQuery').value;
            const resultsDiv = document.getElementById('pexelsResults');
            
            resultsDiv.innerHTML = '<div style="grid-column: span 4; text-align: center; padding: 40px;">🔍 搜索中...</div>';

            try {
                const response = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=20&size=small`, {
                    headers: { Authorization: PEXELS_API_KEY }
                });
                const data = await response.json();

                if (data.photos && data.photos.length > 0) {
                    resultsDiv.innerHTML = data.photos.map(photo => `
                        <div style="cursor: pointer; border-radius: 8px; overflow: hidden; border: 2px solid transparent; transition: all 0.2s;" 
                             onmouseover="this.style.borderColor='#6366f1'" 
                             onmouseout="this.style.borderColor='transparent'"
                             onclick="addPexelsImage('${photo.src.medium}')">
                            <img src="${photo.src.small}" style="width: 100%; height: 100px; object-fit: cover;" alt="${photo.alt || ''}">
                        </div>
                    `).join('');
                } else {
                    resultsDiv.innerHTML = '<div style="grid-column: span 4; text-align: center; color: #999; padding: 40px;">未找到图片，请尝试其他关键词</div>';
                }
            } catch (err) {
                console.error('Pexels搜索错误:', err);
                resultsDiv.innerHTML = '<div style="grid-column: span 4; text-align: center; color: #ef4444; padding: 40px;">搜索失败，请重试</div>';
            }
        }

        function addPexelsImage(url) {
            fabric.Image.fromURL(url, function(img) {
                const maxSize = 400;
                if (img.width > maxSize || img.height > maxSize) {
                    const scale = Math.min(maxSize / img.width, maxSize / img.height);
                    img.scale(scale);
                }
                img.set({
                    left: 100,
                    top: 100,
                    customId: 'pexels-' + Date.now(),
                    customName: 'Pexels图片'
                });
                canvas.add(img);
                canvas.setActiveObject(img);
                updateLayersList();
                closePexelsModal();
                showToast('✅ 图片添加成功', 'success');
            }, { crossOrigin: 'anonymous' });
        }

        // ========== 产品库功能 ==========
        let currentProduct = 'fabrang-wine';
        let currentProductHtml = '';

        const PRODUCTS_CONFIG = {
            'fabrang-wine': { name: '法布朗红酒', icon: '🍷', style: 'luxury' },
            'swan-legend': { name: '法布朗传奇', icon: '🦢', style: 'minimal' }
        };

        function showProductsModal() {
            document.getElementById('productsModal').classList.add('show');
            selectProduct(currentProduct);
        }

        function closeProductsModal() {
            document.getElementById('productsModal').classList.remove('show');
        }

        function selectProduct(productId) {
            currentProduct = productId;
            document.querySelectorAll('.product-item').forEach(item => {
                item.classList.toggle('active', item.dataset.product === productId);
            });
            // 加载预览
            const frame = document.getElementById('productFrame');
            frame.src = `details/${productId}/index.html`;
        }

        function previewProduct() {
            window.open(`details/${currentProduct}/index.html`, '_blank');
        }

        async function loadProductAsJson() {
            try {
                showToast('⏳ 正在转换...');
                const json = await convertHtmlToJson(currentProduct);
                loadFromJson(json);
                closeProductsModal();
                showToast('✅ 产品已加载到编辑器', 'success');
            } catch (err) {
                console.error(err);
                showToast('❌ 转换失败: ' + err.message);
            }
        }

        async function showProductJson() {
            try {
                const json = await convertHtmlToJson(currentProduct);
                document.getElementById('jsonContent').value = JSON.stringify(json, null, 2);
                document.getElementById('jsonModal').classList.add('show');
            } catch (err) {
                showToast('❌ 转换失败: ' + err.message);
            }
        }

        async function convertHtmlToJson(productId) {
            // Fetch HTML
            const response = await fetch(`details/${productId}/index.html`);
            const html = await response.text();

            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const detailPage = doc.querySelector('.detail-page') || doc.body;

            const config = PRODUCTS_CONFIG[productId] || {};
            const layers = [];
            let yOffset = 0;

            // 解析每个 section
            const sections = detailPage.querySelectorAll('.section');
            sections.forEach((section, sIndex) => {
                const sectionName = section.dataset.section || `section-${sIndex}`;
                const sectionHeight = estimateSectionHeight(sectionName);

                // 添加 section 背景
                layers.push({
                    id: `${sectionName}-bg`,
                    type: 'rect',
                    name: `${sectionName} 背景`,
                    x: 0,
                    y: yOffset,
                    width: 1000,
                    height: sectionHeight,
                    fill: getSectionBgColor(sectionName, config.style)
                });

                // 解析文字元素
                let textIndex = 0;
                section.querySelectorAll('[data-editable]').forEach((el) => {
                    const editKey = el.dataset.editable;
                    const text = el.textContent.trim().replace(/\s+/g, ' ');
                    const fontSize = getFontSizeFromTag(el);
                    const color = getTextColorFromTag(el, config.style);

                    layers.push({
                        id: editKey,
                        type: 'text',
                        name: editKey,
                        content: text.substring(0, 100), // 限制长度
                        x: 500,
                        y: yOffset + 50 + textIndex * 50,
                        fontSize: fontSize,
                        fill: color,
                        originX: 'center',
                        fontFamily: 'PingFang SC'
                    });
                    textIndex++;
                });

                // 解析图片插槽
                section.querySelectorAll('[data-slot]').forEach((slot) => {
                    const slotId = slot.dataset.slot;
                    const img = slot.querySelector('img');
                    if (img && img.src) {
                        layers.push({
                            id: slotId,
                            type: 'image-placeholder',
                            name: slotId,
                            src: img.src,
                            x: 250,
                            y: yOffset + 50,
                            width: 500,
                            height: 300
                        });
                    }
                });

                yOffset += sectionHeight;
            });

            return {
                version: "1.0",
                name: config.name || productId,
                sourceProduct: productId,
                width: 1000,
                height: yOffset,
                background: config.style === 'minimal' ? '#ffffff' : '#1a1a2e',
                layers: layers
            };
        }

        function estimateSectionHeight(sectionName) {
            const heights = {
                'hero': 700,
                'intro': 300,
                'features': 250,
                'origin': 450,
                'pairing': 250,
                'footer': 150,
                'alcohol': 400,
                'flavor': 450,
                'nfc': 300,
                'specs': 400
            };
            return heights[sectionName] || 300;
        }

        function getSectionBgColor(sectionName, style) {
            if (style === 'minimal') {
                const colors = {
                    'hero': '#ffffff',
                    'alcohol': '#1a1a1a',
                    'origin': '#fafafa',
                    'flavor': '#ffffff',
                    'pairing': '#f9f6f0',
                    'nfc': '#1a1a1a',
                    'specs': '#ffffff',
                    'footer': '#f5f5f5'
                };
                return colors[sectionName] || '#ffffff';
            }
            const colors = {
                'hero': '#1a1a2e',
                'intro': '#1a1a2e',
                'features': '#16213e',
                'origin': '#1a1a2e',
                'pairing': '#0f0f1a',
                'footer': '#0a0a14'
            };
            return colors[sectionName] || '#1a1a2e';
        }

        function getFontSizeFromTag(el) {
            const tag = el.tagName.toLowerCase();
            const sizes = { 'h1': 48, 'h2': 28, 'h3': 22, 'p': 16, 'span': 14 };
            return sizes[tag] || 16;
        }

        function getTextColorFromTag(el, style) {
            const tag = el.tagName.toLowerCase();
            if (style === 'minimal') {
                if (tag === 'h1') return '#1a1a1a';
                if (tag === 'h2' || tag === 'h3') return '#d4af37';
                return '#666666';
            }
            if (tag === 'h1') return '#ffffff';
            if (tag === 'h2' || tag === 'h3') return '#d4af37';
            return '#cccccc';
        }
    </script>
