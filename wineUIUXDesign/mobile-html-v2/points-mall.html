<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><title>积分商城</title>
<style>
:root{--bg:#f4ede3;--card:#fffaf2;--p:#711328;--t:#2f2a27;--l:#ead9bf;--s:0 8px 24px rgba(113,19,40,.1)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 10% 0%,#fff9ef,#f3ebdf 46%,#ecdfce 100%);color:var(--t)}
.phone{max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;padding:10px 12px 12px;border-bottom-left-radius:14px;border-bottom-right-radius:14px;background:linear-gradient(145deg,#3f1122,#6e1a2f 58%,#6f4a24);color:#fff}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.btn-link{text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);border-radius:999px;padding:6px 10px;font-size:12px}.tt{text-align:center;font-size:16px;font-weight:700}.sub{margin-top:8px;font-size:12px;line-height:1.5;color:#f5e8da;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
.main{padding:12px;display:grid;gap:12px}.sum{background:var(--card);border:1px solid var(--l);border-radius:14px;box-shadow:var(--s);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#fff;border:1px solid #ecdabf;border-radius:10px;padding:8px}.k{font-size:11px;color:#796f67}.v{margin-top:3px;font-size:18px;font-weight:800;color:#411a22}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:var(--card);border:1px solid var(--l);border-radius:12px;box-shadow:var(--s);padding:8px}.img{height:76px;border-radius:10px;background:linear-gradient(145deg,#f9ecd8,#e7c491)}.name{margin:7px 0 4px;font-size:13px;color:#3d1921}.pts{font-size:12px;color:#675d55}.pts b{color:#9a1f3d}.btn{margin-top:7px;width:100%;height:30px;border:0;border-radius:999px;color:#fff;font-size:12px;font-weight:700;background:linear-gradient(135deg,#7a0f28,#9b1b3a)}
.task{background:var(--card);border:1px solid var(--l);border-radius:14px;box-shadow:var(--s);padding:10px}.task h3{margin:0 0 8px;font-size:15px}.rowt{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#fff;border:1px dashed #ead5b0;border-radius:10px;margin-bottom:7px;font-size:12px;color:#5f554d}.rowt b{color:#7a4f28}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:375px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #eadfcd;background:rgba(255,250,242,.98);display:grid;grid-template-columns:repeat(5,1fr)}.nav a{text-decoration:none;text-align:center;font-size:11px;color:#6f665f}.nav a.active{color:var(--p);font-weight:700}

/* v2 theme overrides: youthful light-lux */
:root{
  --bg:#fbf7f1;
  --card:rgba(255,255,255,.84);
  --p:#6c0f2a;
  --t:#231d20;
  --m:#72686c;
  --l:rgba(108,15,42,.14);
  --s:0 14px 30px rgba(108,15,42,.12);
  --radius:18px;

  --primary:#6c0f2a;
  --primary-2:#ff4d6d;
  --gold:#ffb86b;
  --text:#231d20;
  --muted:#72686c;
  --shadow:0 14px 30px rgba(108,15,42,.12);

  --wine-bg:#fbf7f1;
  --wine-card:rgba(255,255,255,.86);
  --wine-primary:#6c0f2a;
  --wine-gold:#ffb86b;
  --wine-text:#231d20;
  --wine-sub:#72686c;
}

body{
  background:
    radial-gradient(900px 420px at 12% -10%, rgba(255,77,109,.22), transparent 60%),
    radial-gradient(700px 520px at 96% 6%, rgba(255,184,107,.20), transparent 62%),
    radial-gradient(700px 520px at 20% 96%, rgba(108,15,42,.12), transparent 58%),
    linear-gradient(180deg,#fff9f3 0%,#fbf3ea 55%,#f8efe6 100%);
}

.phone{position:relative}

/* Global cards */
.card,.section,.item{
  border-radius:var(--radius) !important;
  box-shadow:var(--shadow) !important;
  border:1px solid var(--l) !important;
  background:var(--card) !important;
  backdrop-filter:blur(10px);
}

/* Top bars */
.top,.topbar{
  background:linear-gradient(135deg,#4f0b1f 0%, #7b1234 48%, #ff4d6d 120%) !important;
}

/* Buttons */
.btn,.msg-btn,button{
  transition:transform .08s ease, filter .18s ease, box-shadow .18s ease;
}
.btn{box-shadow:0 12px 22px rgba(108,15,42,.18)}
.btn:active,.msg-btn:active,button:active{transform:translateY(1px) scale(.99);filter:saturate(1.08)}

/* Links as chips */
.lk,.item{
  border:1px solid rgba(108,15,42,.12) !important;
  background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.78)) !important;
}

/* Subtle sticker accents on hero/banner blocks if present */
.banner,.hero{
  position:relative;
  overflow:hidden;
}
.banner::before,.hero::before{
  content:"";
  position:absolute;
  top:-36px;
  right:-46px;
  width:140px;
  height:140px;
  border-radius:42px;
  background:linear-gradient(135deg, rgba(255,184,107,.78), rgba(255,77,109,.62));
  filter:blur(.2px);
  transform:rotate(16deg);
  opacity:.55;
}
.banner::after,.hero::after{
  content:"";
  position:absolute;
  left:-56px;
  bottom:-62px;
  width:180px;
  height:180px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 62%);
  opacity:.45;
}

/* Reduce "old-school" heavy text */
.title h3,h1,h2,h3{letter-spacing:.2px}
</style></head><body>
<div class="phone"><header class="top"><div class="row"><a class="btn-link" href="home.html">返回</a><div class="tt">积分商城</div><a class="btn-link" href="member-center.html">明细</a></div><div class="sub">酒类专属积分兑换：酒具、醒酒器、品鉴课兑换券、试饮小酒、满减券、数字酒窖体验券。</div></header>
<main class="main"><section class="sum"><div class="box"><div class="k">可用积分</div><div class="v">8,460</div></div><div class="box"><div class="k">即将过期（30天）</div><div class="v">620</div></div></section>
<section class="grid" id="grid"></section>
<section class="task"><h3>赚积分任务</h3><div class="rowt"><span>每日签到</span><b>+10</b></div><div class="rowt"><span>下单任意酒款</span><b>+80</b></div><div class="rowt"><span>参与酒局游戏</span><b>+50</b></div><div class="rowt"><span>NFC互动活动</span><b>+30</b></div></section></main>
<nav class="nav"><a href="home.html">首页</a><a href="category.html">分类</a><a href="group-buy.html">活动</a><a href="digital-cellar.html">酒窖</a><a class="active" href="points-mall.html">我的</a></nav></div>
<script>
const items=[['Riedel酒杯套装',2680],['专业开瓶器',980],['醒酒器',1560],['品鉴课兑换券',2200],['试饮小酒礼盒',1280],['满减券',860],['数字酒窖体验券',1200]];
const grid=document.getElementById('grid');grid.innerHTML=items.map(i=>`<article class="card"><div class="img"></div><h4 class="name">${i[0]}</h4><p class="pts">所需积分 <b>${i[1]}</b></p><button class="btn">立即兑换</button></article>`).join('');
</script></body></html>
