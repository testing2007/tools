<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><title>酒局游戏</title>
<style>
:root{--bg:#f4ede3;--card:#fffaf2;--p:#711328;--t:#2f2a27;--l:#ead9bf;--s:0 8px 24px rgba(113,19,40,.1)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 10% 0%,#fff7ef,#f7e8db 46%,#f0ddca 100%);color:var(--t)}.phone{max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;padding:10px 12px 12px;border-bottom-left-radius:14px;border-bottom-right-radius:14px;background:linear-gradient(140deg,#7a0f28,#b82e4b 65%,#de7b3e);color:#fff}.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.btn-link{text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);border-radius:999px;padding:6px 10px;font-size:12px}.tt{text-align:center;font-size:16px;font-weight:700}.sub{margin-top:8px;font-size:12px;line-height:1.5;color:#fff3e4;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px}
.main{padding:12px;display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--l);border-radius:14px;box-shadow:var(--s);padding:10px}.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{height:34px;border:0;border-radius:999px;color:#fff;font-size:12px;font-weight:700;background:linear-gradient(135deg,#7a0f28,#9b1b3a)}
.line{font-size:12px;color:#5f554d;background:#fff;border:1px dashed #ead5b0;border-radius:10px;padding:8px;margin-bottom:7px}.rank{display:grid;gap:7px}.rk{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #ecdabf;border-radius:10px;padding:8px;font-size:12px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:375px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #eadfcd;background:rgba(255,250,242,.98);display:grid;grid-template-columns:repeat(5,1fr)}.nav a{text-decoration:none;text-align:center;font-size:11px;color:#6f665f}.nav a.active{color:var(--p);font-weight:700}

/* v2 theme overrides: youthful light-lux */
:root{
  --bg:#fbf7f1;
  --card:rgba(255,255,255,.84);
  --p:#6c0f2a;
  --t:#231d20;
  --m:#72686c;
  --l:rgba(108,15,42,.14);
  --s:0 14px 30px rgba(108,15,42,.12);
  --radius:18px;

  --primary:#6c0f2a;
  --primary-2:#ff4d6d;
  --gold:#ffb86b;
  --text:#231d20;
  --muted:#72686c;
  --shadow:0 14px 30px rgba(108,15,42,.12);

  --wine-bg:#fbf7f1;
  --wine-card:rgba(255,255,255,.86);
  --wine-primary:#6c0f2a;
  --wine-gold:#ffb86b;
  --wine-text:#231d20;
  --wine-sub:#72686c;
}

body{
  background:
    radial-gradient(900px 420px at 12% -10%, rgba(255,77,109,.22), transparent 60%),
    radial-gradient(700px 520px at 96% 6%, rgba(255,184,107,.20), transparent 62%),
    radial-gradient(700px 520px at 20% 96%, rgba(108,15,42,.12), transparent 58%),
    linear-gradient(180deg,#fff9f3 0%,#fbf3ea 55%,#f8efe6 100%);
}

.phone{position:relative}

/* Global cards */
.card,.section,.item{
  border-radius:var(--radius) !important;
  box-shadow:var(--shadow) !important;
  border:1px solid var(--l) !important;
  background:var(--card) !important;
  backdrop-filter:blur(10px);
}

/* Top bars */
.top,.topbar{
  background:linear-gradient(135deg,#4f0b1f 0%, #7b1234 48%, #ff4d6d 120%) !important;
}

/* Buttons */
.btn,.msg-btn,button{
  transition:transform .08s ease, filter .18s ease, box-shadow .18s ease;
}
.btn{box-shadow:0 12px 22px rgba(108,15,42,.18)}
.btn:active,.msg-btn:active,button:active{transform:translateY(1px) scale(.99);filter:saturate(1.08)}

/* Links as chips */
.lk,.item{
  border:1px solid rgba(108,15,42,.12) !important;
  background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.78)) !important;
}

/* Subtle sticker accents on hero/banner blocks if present */
.banner,.hero{
  position:relative;
  overflow:hidden;
}
.banner::before,.hero::before{
  content:"";
  position:absolute;
  top:-36px;
  right:-46px;
  width:140px;
  height:140px;
  border-radius:42px;
  background:linear-gradient(135deg, rgba(255,184,107,.78), rgba(255,77,109,.62));
  filter:blur(.2px);
  transform:rotate(16deg);
  opacity:.55;
}
.banner::after,.hero::after{
  content:"";
  position:absolute;
  left:-56px;
  bottom:-62px;
  width:180px;
  height:180px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 62%);
  opacity:.45;
}

/* Reduce "old-school" heavy text */
.title h3,h1,h2,h3{letter-spacing:.2px}
</style></head><body>
<div class="phone"><header class="top"><div class="row"><a class="btn-link" href="home.html">返回</a><div class="tt">酒局游戏</div><a class="btn-link" href="nfc-redpacket.html">红包</a></div><div class="sub">多人互动场景：拼手气红包、抽奖、喝酒互动任务，适合酒类社交营销活动。</div></header>
<main class="main"><section class="card"><div class="btns"><button class="btn">创建房间</button><button class="btn">邀请好友</button></div><div class="line" style="margin-top:8px">当前参与人数：16 人</div></section>

</body></html>
