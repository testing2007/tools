<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><title>订单列表</title>
<style>
:root{--bg:#f4ede3;--card:#fffaf2;--p:#711328;--t:#2f2a27;--l:#ead9bf;--s:0 8px 24px rgba(113,19,40,.1)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 10% 0%,#fff9ef,#f3ebdf 46%,#ecdfce 100%);color:var(--t)}.phone{max-width:375px;margin:0 auto;min-height:100vh}.top{padding:10px 12px;background:linear-gradient(135deg,#6f1125,#9a1e3d);color:#fff;text-align:center;font-weight:700}.main{padding:12px;display:grid;gap:10px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tab{height:32px;border-radius:999px;border:1px solid #e8d7bd;background:#fff;font-size:12px}.tab.active{background:linear-gradient(135deg,#7a0f28,#9b1b3a);color:#fff;border:0}
.item{text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--l);border-radius:12px;box-shadow:var(--s);padding:9px;display:block}.row{display:flex;justify-content:space-between;font-size:12px;color:#6f665f}.n{margin:7px 0 4px;font-size:14px;color:#3d1921}

/* v2 theme overrides: youthful light-lux */
:root{
  --bg:#fbf7f1;
  --card:rgba(255,255,255,.84);
  --p:#6c0f2a;
  --t:#231d20;
  --m:#72686c;
  --l:rgba(108,15,42,.14);
  --s:0 14px 30px rgba(108,15,42,.12);
  --radius:18px;

  --primary:#6c0f2a;
  --primary-2:#ff4d6d;
  --gold:#ffb86b;
  --text:#231d20;
  --muted:#72686c;
  --shadow:0 14px 30px rgba(108,15,42,.12);

  --wine-bg:#fbf7f1;
  --wine-card:rgba(255,255,255,.86);
  --wine-primary:#6c0f2a;
  --wine-gold:#ffb86b;
  --wine-text:#231d20;
  --wine-sub:#72686c;
}

body{
  background:
    radial-gradient(900px 420px at 12% -10%, rgba(255,77,109,.22), transparent 60%),
    radial-gradient(700px 520px at 96% 6%, rgba(255,184,107,.20), transparent 62%),
    radial-gradient(700px 520px at 20% 96%, rgba(108,15,42,.12), transparent 58%),
    linear-gradient(180deg,#fff9f3 0%,#fbf3ea 55%,#f8efe6 100%);
}

.phone{position:relative}

/* Global cards */
.card,.section,.item{
  border-radius:var(--radius) !important;
  box-shadow:var(--shadow) !important;
  border:1px solid var(--l) !important;
  background:var(--card) !important;
  backdrop-filter:blur(10px);
}

/* Top bars */
.top,.topbar{
  background:linear-gradient(135deg,#4f0b1f 0%, #7b1234 48%, #ff4d6d 120%) !important;
}

/* Buttons */
.btn,.msg-btn,button{
  transition:transform .08s ease, filter .18s ease, box-shadow .18s ease;
}
.btn{box-shadow:0 12px 22px rgba(108,15,42,.18)}
.btn:active,.msg-btn:active,button:active{transform:translateY(1px) scale(.99);filter:saturate(1.08)}

/* Links as chips */
.lk,.item{
  border:1px solid rgba(108,15,42,.12) !important;
  background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.78)) !important;
}

/* Subtle sticker accents on hero/banner blocks if present */
.banner,.hero{
  position:relative;
  overflow:hidden;
}
.banner::before,.hero::before{
  content:"";
  position:absolute;
  top:-36px;
  right:-46px;
  width:140px;
  height:140px;
  border-radius:42px;
  background:linear-gradient(135deg, rgba(255,184,107,.78), rgba(255,77,109,.62));
  filter:blur(.2px);
  transform:rotate(16deg);
  opacity:.55;
}
.banner::after,.hero::after{
  content:"";
  position:absolute;
  left:-56px;
  bottom:-62px;
  width:180px;
  height:180px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 62%);
  opacity:.45;
}

/* Reduce "old-school" heavy text */
.title h3,h1,h2,h3{letter-spacing:.2px}
</style></head><body><div class="phone"><header class="top">订单列表</header><main class="main"><section class="tabs"><button class="tab active">全部</button><button class="tab">待付款</button><button class="tab">待收货</button><button class="tab">已完成</button></section>

</main></div></body></html>
