<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AR 体验</title>
  <style>
    :root{--bg:#f2f5fb;--panel:#ffffff;--ink:#131927;--muted:#5a667f;--blue:#245ed7;--blue2:#3f86ff;--line:rgba(36,94,215,.2);--safe:calc(80px + env(safe-area-inset-bottom));--shadow:0 12px 26px rgba(25,41,78,.14)}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(70% 45% at 0 0,rgba(63,134,255,.22),transparent 70%),radial-gradient(65% 40% at 100% 6%,rgba(36,94,215,.2),transparent 70%),var(--bg);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);display:flex;justify-content:center}
    .app{width:min(100vw,375px);min-height:100dvh;background:linear-gradient(180deg,rgba(248,251,255,.95),rgba(242,247,255,.98));padding-bottom:var(--safe)}
    .top{position:sticky;top:0;z-index:20;padding:10px 12px;background:linear-gradient(180deg,rgba(19,25,39,.96),rgba(19,25,39,.9));border-bottom:1px solid rgba(157,187,246,.28)}
    .r{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center}.ttl{text-align:center;color:#edf3ff;font-size:16px;font-weight:700}
    .ib{height:34px;border-radius:10px;border:1px solid rgba(157,187,246,.35);background:rgba(255,255,255,.08);display:grid;place-items:center;color:#e6efff;text-decoration:none}
    .icon{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .hero{margin:10px;border-radius:16px;overflow:hidden;position:relative;min-height:188px;padding:12px;color:#eef4ff;display:grid;align-content:end;gap:8px;background-image:linear-gradient(150deg,rgba(14,20,34,.76),rgba(14,20,34,.3)),url('https://images.unsplash.com/photo-1526948128573-703ee1aeb6fa?auto=format&fit=crop&w=1200&q=80');background-size:cover;background-position:center;box-shadow:0 14px 34px rgba(23,35,67,.28)}
    .hero h1{margin:0;font-size:21px}.hero p{margin:0;font-size:12px;color:rgba(233,242,255,.9)}
    .chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid rgba(168,194,247,.45);background:rgba(255,255,255,.12)}
    .scan{margin:10px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px}
    .frame{height:190px;border-radius:12px;background:linear-gradient(145deg,#0f1f3f,#1b3d7c);position:relative;overflow:hidden}
    .frame::before{content:"";position:absolute;inset:18px;border:1px dashed rgba(176,200,248,.55);border-radius:10px}
    .beam{position:absolute;left:14px;right:14px;height:3px;background:linear-gradient(90deg,rgba(0,0,0,0),#8fc1ff,rgba(0,0,0,0));top:26px;animation:scan 2.2s ease-in-out infinite}
    @keyframes scan{0%{top:26px}50%{top:158px}100%{top:26px}}
    .scanTip{margin-top:8px;font-size:12px;color:var(--muted)}
    .grid{margin:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .card{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 10px 22px rgba(25,41,78,.1);padding:10px;min-height:94px;text-decoration:none;color:inherit}
    .card b{display:block;font-size:12px;margin-bottom:4px}.card small{font-size:11px;color:var(--muted);line-height:1.4}
    .tour{margin:10px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:10px;display:grid;gap:7px}
    .step{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:12px;color:#3f4b66}
    .dot{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#245ed7,#3f86ff);color:#fff;display:grid;place-items:center;font-size:11px}
    .cta{margin:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{height:38px;border-radius:10px;display:grid;place-items:center;text-decoration:none;font-size:12px}
    .btn.p{background:linear-gradient(135deg,#245ed7,#3f86ff);color:#edf3ff}.btn.g{border:1px solid var(--line);background:#fff;color:#2b3a58}
    .bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,375px);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(19,25,39,.96);border-top:1px solid rgba(157,187,246,.28)}
    .tab{text-decoration:none;color:rgba(231,239,255,.78);font-size:11px;display:grid;justify-items:center;gap:2px}.tab svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}.tab.active{color:#a8c7ff}
    @media (prefers-reduced-motion: reduce){.beam{animation:none}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="r"><a class="ib" href="home.html"><svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a><div class="ttl">AR 体验</div><a class="ib" href="member-center.html"><svg class="icon" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M4 20a8 8 0 0 1 16 0"/></svg></a></div></header>
    <section class="hero"><h1>扫一扫酒标，进入 AR 导览</h1><p>识别瓶身后可查看产地故事、侍酒演示与 3D 细节。</p><div class="chips"><span class="chip">沉浸交互</span><span class="chip">可跳过动画</span><span class="chip">移动端友好</span></div></section>
    <section class="scan"><div class="frame"><div class="beam"></div></div><div class="scanTip">请将酒标对准取景框中心，系统将在 1-2 秒内识别。</div></section>
    <section class="grid">
      <a class="card" href="product-detail.html"><b>酒标识别</b><small>读取年份、产区、等级与适饮窗口</small></a>
      <a class="card" href="traceability.html"><b>批次溯源</b><small>查看流通路径与防伪校验结果</small></a>
      <a class="card" href="ai-sommelier.html"><b>侍酒演示</b><small>醒酒、温控、杯型选择建议</small></a>
      <a class="card" href="digital-cellar.html"><b>3D 瓶身</b><small>旋转查看标签细节并可入窖</small></a>
    </section>
    <section class="tour">
      <div class="step"><div class="dot">1</div><div>扫描酒标后，先展示识别结果与可信度。</div></div>
      <div class="step"><div class="dot">2</div><div>点击“产地故事”观看 30 秒庄园短片。</div></div>
      <div class="step"><div class="dot">3</div><div>进入 3D 模式可查看瓶身细节，支持跳过。</div></div>
      <div class="step"><div class="dot">4</div><div>完成导览后给出购买、入窖与侍酒推荐 CTA。</div></div>
    </section>
    <section class="cta"><a class="btn p" href="product-detail.html">继续 AR 导览</a><a class="btn g" href="home.html">跳过并返回首页</a></section>
  </main>
  <nav class="bottom"><a class="tab" href="home.html"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>首页</a><a class="tab" href="category.html"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>分类</a><a class="tab active" href="ar-experience.html"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14M5 5h14v14H5z"/></svg>AR</a><a class="tab" href="digital-cellar.html"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h6"/></svg>酒窖</a><a class="tab" href="member-center.html"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0"/></svg>我的</a></nav>
</body>
</html>
