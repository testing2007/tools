<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>订单列表</title>
  <style>
    :root {
      --bg: #f6f2ed;
      --panel: rgba(255, 250, 244, .96);
      --ink: #17110f;
      --muted: #6d6058;
      --line: rgba(163, 86, 36, .16);
      --wine: #6c1d18;
      --wine-2: #a73625;
      --gold: #d39a36;
      --shadow: 0 14px 34px rgba(38, 24, 18, .14);
      --safe-bottom: calc(92px + env(safe-area-inset-bottom));
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      color: var(--ink);
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: #666;
    }

    .app {
      width: min(100vw, 375px);
      min-height: 100dvh;
      padding-bottom: var(--safe-bottom);
      overflow-x: hidden;
      background: radial-gradient(72% 42% at 0 0, rgba(249, 115, 22, .14), transparent 68%), radial-gradient(58% 36% at 100% 6%, rgba(163, 54, 37, .16), transparent 70%), linear-gradient(180deg, #fbf7f1 0%, #f7f0e8 54%, #f4ece3 100%);

    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      gap: 8px;
      align-items: center;
      padding: 10px 12px 12px;
      border-bottom: 1px solid rgba(255, 210, 165, .24);
      background: linear-gradient(180deg, rgba(24, 18, 16, .96), rgba(24, 18, 16, .9));
      backdrop-filter: blur(10px);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      border: 1px solid rgba(255, 218, 180, .32);
      background: rgba(255, 255, 255, .08);
      color: #f7e2bf;
      text-decoration: none
    }

    .icon {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .title {
      text-align: center;
      color: #fff1d8;
      font-size: 16px;
      font-weight: 700
    }

    .searchbar {
      margin: 10px 10px 0;
      display: grid;
      grid-template-columns: 1fr 44px;
      gap: 8px
    }

    .searchbar input {
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(163, 86, 36, .16);
      background: #fff;
      padding: 0 12px;
      font-size: 13px;
      outline: none;
      box-shadow: 0 8px 16px rgba(41, 24, 17, .05);
    }

    .searchbar button {
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #6c1d18, #a73625);
      color: #fff5e3;
      font-size: 12px;
      font-weight: 700
    }

    .hero {
      margin: 10px;
      border-radius: 18px;
      padding: 12px;
      color: #fff6e7;
      background: linear-gradient(145deg, rgba(14, 11, 10, .86), rgba(110, 28, 22, .76)), url('https://images.unsplash.com/photo-1450101499163-c8848c66ca85?auto=format&fit=crop&w=1200&q=80') center/cover;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 4px 0 6px;
      font-size: 20px;
      line-height: 1.2
    }

    .hero p {
      margin: 0;
      font-size: 12px;
      color: rgba(255, 244, 225, .9);
      line-height: 1.5
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px
    }

    .chip {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      border: 1px solid rgba(255, 224, 192, .26);
      background: rgba(255, 255, 255, .08)
    }

    .tabs {
      margin: 10px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      background: rgba(255, 251, 247, .72);
      border: 1px solid rgba(163, 86, 36, .12);
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 10px 18px rgba(39, 24, 17, .06)
    }

    .tabs button {
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #65564f;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer
    }

    .tabs button.active {
      background: linear-gradient(135deg, #6c1d18, #a73625);
      color: #fff7ea;
      box-shadow: 0 8px 16px rgba(101, 27, 22, .22)
    }

    .panel {
      margin: 10px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .panel-head {
      padding: 12px 12px 10px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      border-bottom: 1px solid rgba(163, 86, 36, .08);
      background: linear-gradient(180deg, rgba(255, 245, 231, .9), rgba(255, 251, 247, .96))
    }

    .panel-head b {
      font-size: 15px
    }

    .panel-head span {
      font-size: 11px;
      color: var(--muted)
    }

    .orders {
      padding: 10px 12px 12px;
      display: grid;
      gap: 10px
    }

    .order {
      border-radius: 16px;
      border: 1px solid rgba(163, 86, 36, .14);
      background: #fff;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(41, 24, 17, .06)
    }

    .order-top {
      padding: 10px 10px 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
      border-bottom: 1px solid rgba(163, 86, 36, .08)
    }

    .order-id {
      display: grid;
      gap: 4px
    }

    .order-id b {
      font-size: 12px
    }

    .order-id small {
      font-size: 11px;
      color: var(--muted)
    }

    .state {
      font-size: 11px;
      border-radius: 999px;
      padding: 4px 8px;
      color: #7a4b14;
      background: #fff5df;
      border: 1px solid rgba(163, 86, 36, .16)
    }

    .state.warn {
      color: #8f2f3a;
      background: #ffecef;
      border-color: rgba(143, 47, 58, .14)
    }

    .order-body {
      padding: 10px;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px
    }

    .thumb {
      width: 72px;
      height: 94px;
      border-radius: 12px;
      object-fit: cover
    }

    .meta {
      display: grid;
      gap: 6px
    }

    .meta h3 {
      margin: 0;
      font-size: 13px;
      line-height: 1.35
    }

    .text {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45
    }

    .tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap
    }

    .tag {
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 10px;
      border: 1px solid rgba(163, 86, 36, .15);
      background: #fff7eb;
      color: #80520f
    }

    .tag.bad {
      background: #ffecef;
      color: #8f2f3a;
      border-color: rgba(143, 47, 58, .18)
    }

    .tag.pool {
      background: #eaf7f0;
      color: #1f6d4f;
      border-color: rgba(31, 109, 79, .16)
    }

    .money {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap
    }

    .money b {
      font-size: 16px;
      color: #b11f2a
    }

    .money s {
      font-size: 11px;
      color: #998d84
    }

    .order-tools {
      padding: 0 10px 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px
    }

    .tool {
      height: 32px;
      border-radius: 10px;
      border: 1px solid rgba(163, 86, 36, .16);
      background: #fff;
      font-size: 11px;
      color: #5f524b
    }

    .mini-cards {
      padding: 0 10px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .mini {
      border-radius: 14px;
      border: 1px solid rgba(163, 86, 36, .14);
      background: #fff;
      text-decoration: none;
      color: inherit;
      overflow: hidden
    }

    .mini img {
      width: 100%;
      height: 72px;
      object-fit: cover;
      display: block
    }

    .mini .txt {
      padding: 8px
    }

    .mini b {
      display: block;
      font-size: 12px
    }

    .mini small {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4
    }

    .explore {
      margin: 10px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .explore .inner {
      padding: 12px;
      display: grid;
      gap: 8px
    }

    .explore .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .explore .card {
      border-radius: 14px;
      border: 1px solid rgba(163, 86, 36, .14);
      background: #fff;
      text-decoration: none;
      color: inherit;
      overflow: hidden
    }

    .explore .card img {
      width: 100%;
      height: 84px;
      object-fit: cover;
      display: block
    }

    .explore .card .txt {
      padding: 8px
    }

    .explore .card b {
      display: block;
      font-size: 12px
    }

    .explore .card small {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4
    }

    .footer {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: min(100vw, 375px);
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(24, 18, 16, .96);
      border-top: 1px solid rgba(250, 226, 184, .24);
      z-index: 30
    }

    .footer-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center
    }

    .checkall {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f6e7c7;
      font-size: 12px
    }

    .checkall input {
      accent-color: #a73625
    }

    .sum {
      color: #f6e7c7;
      font-size: 12px;
      line-height: 1.4
    }

    .sum b {
      color: #ffd98f;
      font-size: 15px
    }

    .go {
      height: 40px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #6c1d18, #a73625);
      color: #fff6e7;
      font-size: 13px;
      font-weight: 700;
      padding: 0 14px
    }

    .nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(60px + env(safe-area-inset-bottom));
      width: min(100vw, 375px);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 8px 0;
      z-index: 20;
      pointer-events: none
    }

    .nav .tab {
      text-decoration: none;
      color: rgba(255, 242, 218, .76);
      font-size: 11px;
      display: grid;
      justify-items: center;
      gap: 2px;
      pointer-events: auto
    }

    .nav .tab svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8
    }

    .nav .tab.active {
      color: #f6d69f
    }

    .sheet {
      position: fixed;
      left: 50%;
      transform: translateX(-50%) translateY(110%);
      bottom: 0;
      width: min(100vw, 375px);
      z-index: 40;
      border-radius: 18px 18px 0 0;
      background: #fffdf8;
      border: 1px solid rgba(163, 86, 36, .18);
      padding: 12px;
      box-shadow: 0 -12px 30px rgba(36, 24, 18, .18);
      transition: transform .25s cubic-bezier(.22, 1, .36, 1);
      max-height: 72dvh;
      overflow: auto
    }

    .sheet.show {
      transform: translateX(-50%) translateY(0)
    }

    .sheet h3 {
      margin: 0 0 8px;
      font-size: 15px
    }

    .sheet p {
      margin: 0;
      font-size: 12px;
      color: #5b4f48;
      line-height: 1.55
    }

    .sheet-actions {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .sheet-btn {
      height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(163, 86, 36, .22);
      background: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-btn.primary {
      border: 0;
      background: linear-gradient(135deg, #6c1d18, #a73625);
      color: #fff6e7
    }
  </style>
</head>

    <footer class="footer">
      <div class="footer-row">
        <label class="checkall"><input type="checkbox" checked />全选</label>
        <div class="sum">合计 <b>¥1,117</b><br />会员优惠提示：本单可再减 ¥40</div>
        <button class="go" id="goBtn">去结算</button>
      </div>

  <section class="sheet" id="sheet"></section>

  <script>
    const tabs = [
      '全部', '待支付', '待发货', '待收货', '已完成', '售后中'
    ];
    const orders = [
      {
        id: 'YJ202604210089', status: '待支付', time: '2026-04-21 10:26', paid: '¥429',
        wine: 'Chateau Lumiere Reserve 2018', brand: 'Lumiere Cellars', region: '波尔多左岸', year: '2018',
        qty: 1, img: 'https://images.unsplash.com/photo-1516594915697-87eb3b1c14ea?auto=format&fit=crop&w=500&q=80',
        tags: ['黑樱桃', '单宁明显', '适饮 2026-2031'], flags: ['盲盒资格']
      },
      {
        id: 'YJ202604180076', status: '待收货', time: '2026-04-18 17:11', paid: '¥299',
        wine: 'Maison Etoile Brut NV', brand: 'Maison Etoile', region: '香槟区', year: 'NV',
        qty: 2, img: 'https://images.unsplash.com/photo-1609951651556-5334e2706168?auto=format&fit=crop&w=500&q=80',
        tags: ['青苹果', '起泡', '适合聚会'], flags: []
      },
      {
        id: 'YJ202604120033', status: '已完成', time: '2026-04-12 09:58', paid: '¥189',
        wine: '左岸干红 2019（标签微瑕）', brand: 'Lumiere Cellars', region: '波尔多左岸', year: '2019',
        qty: 1, img: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=500&q=80',
        tags: ['瑕疵酒', '自饮优选', '适饮 2026-2030'], flags: ['介意者慎拍']
      }
    ];

    const tabWrap = document.getElementById('tabs');
    const orderList = document.getElementById('orderList');
    const resultCount = document.getElementById('resultCount');
    const sheet = document.getElementById('sheet');
    const search = document.getElementById('search');

    let activeTab = '全部';
    let query = '';

    tabWrap.innerHTML = tabs.map((t, i) => `<button class="tab-btn ${i === 0 ? 'active' : ''}" data-tab="${t}">${t}</button>`).join('');

    function matchStatus(order) {
      if (activeTab === '全部') return true;
      return order.status === activeTab;
    }
    function matchQuery(order) {
      if (!query) return true;
      const text = [order.id, order.wine, order.brand, order.region].join(' ').toLowerCase();
      return text.includes(query.toLowerCase());
    }

    function render() {
      const list = orders.filter(o => matchStatus(o) && matchQuery(o));
      resultCount.textContent = list.length ? `共 ${list.length} 单` : '无匹配订单';
      orderList.innerHTML = list.map(order => `
        <article class="order">
          <div class="order-top">
            <div class="order-id">
              <b>${order.id}</b>
              <small>${order.time}</small>
            </div>
            <div class="state ${order.status === '待支付' ? 'warn' : ''}">${order.status}</div>
          </div>
          <div class="order-body">
            <img class="thumb" src="${order.img}" alt="${order.wine}" />
            <div class="meta">
              <h3>${order.wine}</h3>
              <div class="text">${order.brand} · ${order.region} · ${order.year}</div>
              <div class="tags">${order.tags.map(t => `<span class="tag">${t}</span>`).join('')}${order.flags.map(t => `<span class="tag bad">${t}</span>`).join('')}</div>
              <div class="money"><b>${order.paid}</b><s>数量 x${order.qty}</s></div>
            </div>
          </div>
          <div class="order-tools">
            <button class="tool">去支付</button>
            <button class="tool">查看详情</button>
            <button class="tool">再来一单</button>
            <button class="tool">申请售后</button>
          </div>
          <div class="mini-cards">
            <a class="mini" href="product-detail.html"><img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=700&q=80" alt="品牌故事"><div class="txt"><b>品牌故事</b><small>了解酒庄历史</small></div></a>
            <a class="mini" href="traceability.html"><img src="https://images.unsplash.com/photo-1556157382-97eda2d62296?auto=format&fit=crop&w=700&q=80" alt="溯源"><div class="txt"><b>真伪 / 批次溯源</b><small>批次号可查</small></div></a>
          </div>
        </article>
      `).join('');
      bindActions();
    }

    function bindActions() {
      document.querySelectorAll('.tool').forEach(btn => {
        btn.onclick = () => openSheet('订单操作', '这里可以进一步处理去支付、查看详情、申请售后、确认收货等动作。');
      });
    }

    tabWrap.addEventListener('click', e => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      activeTab = btn.dataset.tab;
      tabWrap.querySelectorAll('.tab-btn').forEach(n => n.classList.remove('active'));
      btn.classList.add('active');
      render();
    });

    document.getElementById('searchBtn').onclick = () => {query = search.value.trim(); render();};
    search.addEventListener('keydown', e => {if (e.key === 'Enter') {query = search.value.trim(); render();} });
    document.getElementById('goBtn').onclick = () => openSheet('去结算', '已为你跳转到结算中心，继续完成酒类订单。');

    function openSheet(title, body) {
      sheet.innerHTML = `
        <h3>${title}</h3>
        <p>${body}</p>
        <div class="sheet-actions">
          <button class="sheet-btn" id="closeSheet">我知道了</button>
          <a class="sheet-btn primary" href="checkout.html">继续</a>
        </div>
      `;
      sheet.classList.add('show');
      document.getElementById('closeSheet').onclick = () => sheet.classList.remove('show');
    }

    render();
  </script>
</body>
