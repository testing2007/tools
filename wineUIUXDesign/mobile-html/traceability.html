<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><title>真伪/批次溯源</title>
<style>
:root{--bg:#f4ede3;--card:#fffaf2;--p:#711328;--t:#2f2a27;--l:#ead9bf;--s:0 8px 24px rgba(113,19,40,.1)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 10% 0%,#fff9ef,#f3ebdf 46%,#ecdfce 100%);color:var(--t)}.phone{max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;padding:10px 12px 12px;border-bottom-left-radius:14px;border-bottom-right-radius:14px;background:linear-gradient(145deg,#1f3340,#274f5f 60%,#6e1a2f);color:#fff}.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.btn-link{text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);border-radius:999px;padding:6px 10px;font-size:12px}.tt{text-align:center;font-size:16px;font-weight:700}.sub{margin-top:8px;font-size:12px;line-height:1.5;color:#e9f4f8;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
.main{padding:12px;display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--l);border-radius:14px;box-shadow:var(--s);padding:10px}.inp{width:100%;height:38px;border:1px solid #e7d7c1;border-radius:10px;padding:0 12px;font-size:13px}.btn{margin-top:8px;width:100%;height:36px;border:0;border-radius:999px;color:#fff;font-size:13px;font-weight:700;background:linear-gradient(135deg,#7a0f28,#9b1b3a)}
.line{font-size:12px;color:#5f554d;background:#fff;border:1px dashed #ead5b0;border-radius:10px;padding:8px;margin-bottom:7px}.ok{color:#1e6e52;font-weight:700}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:375px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #eadfcd;background:rgba(255,250,242,.98);display:grid;grid-template-columns:repeat(5,1fr)}.nav a{text-decoration:none;text-align:center;font-size:11px;color:#6f665f}.nav a.active{color:var(--p);font-weight:700}
</style></head><body>
<div class="phone"><header class="top"><div class="row"><a class="btn-link" href="home.html">返回</a><div class="tt">真伪/批次溯源</div><a class="btn-link" href="ar-experience.html">AR扫描</a></div><div class="sub">输入防伪码或扫码验证，查看生产日期、产区、进口与流通信息。</div></header>
<main class="main"><section class="card"><input id="code" class="inp" placeholder="输入防伪码，如 WN-2026-8891027" /><button class="btn" id="verify">立即验证</button><button class="btn" style="margin-top:6px;background:linear-gradient(135deg,#345b6b,#1d7685)">扫码入口</button></section>
<section class="card"><h3 style="margin:0 0 8px;font-size:15px">批次信息卡</h3><div class="line">酒款：Chateau Montclair Reserve 2019</div><div class="line">生产日期：2019-10-18</div><div class="line">产区：法国 梅多克 AOC</div><div class="line">进口信息：2021-06 由上海保税仓入关</div><div class="line">流通信息：2026-04 进入平台恒温仓 A 区</div><div class="line">验证结果：<span id="result" class="ok">待验证</span></div></section></main>
<nav class="nav"><a href="home.html">首页</a><a href="category.html">分类</a><a href="group-buy.html">活动</a><a href="digital-cellar.html">酒窖</a><a class="active" href="traceability.html">我的</a></nav></div>
<script>document.getElementById('verify').onclick=()=>{const v=document.getElementById('code').value.trim();document.getElementById('result').textContent=v?'验证通过（批次一致，建议放心饮用）':'请输入防伪码后再验证';};</script>
</body></html>
