<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><title>购物车</title>
<style>
:root{--bg:#f4ede3;--card:#fffaf2;--p:#711328;--t:#2f2a27;--l:#ead9bf;--s:0 8px 24px rgba(113,19,40,.1)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 10% 0%,#fff9ef,#f3ebdf 46%,#ecdfce 100%);color:var(--t)}.phone{max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;padding:10px 12px;background:linear-gradient(135deg,#6f1125,#9a1e3d);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;position:sticky}.top a{position:absolute;left:12px;color:#fff;text-decoration:none;font-size:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);border-radius:999px;padding:6px 10px}.main{padding:12px;display:grid;gap:10px}.item{background:var(--card);border:1px solid var(--l);border-radius:12px;box-shadow:var(--s);padding:9px;display:grid;grid-template-columns:78px 1fr;gap:9px}.img{border-radius:9px;background:linear-gradient(145deg,#f9ecd8,#e7c491)}.n{margin:0 0 4px;font-size:14px}.m{margin:0;font-size:12px;color:#6f665f}.q{margin-top:6px;display:flex;justify-content:space-between;align-items:center}.price{color:#9a1f3d;font-weight:800}
