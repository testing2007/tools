<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><title>拼团</title>
<style>
:root{--bg:#f4ede3;--card:#fffaf2;--p:#711328;--t:#2f2a27;--l:#ead9bf;--s:0 8px 24px rgba(113,19,40,.1)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 10% 0%,#fff9ef,#f3ebdf 46%,#ecdfce 100%);color:var(--t)}
.phone{max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;padding:10px 12px 12px;border-bottom-left-radius:14px;border-bottom-right-radius:14px;background:linear-gradient(140deg,#4f0f22,#7b1730 62%,#a93d57);color:#fff;box-shadow:0 8px 22px rgba(62,16,31,.24)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.btn-link{text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);border-radius:999px;padding:6px 10px;font-size:12px}.tt{text-align:center;font-size:16px;font-weight:700}.sub{margin-top:8px;font-size:12px;line-height:1.5;color:#f5e8da;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
.main{padding:12px;display:grid;gap:12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab{height:34px;border-radius:999px;border:1px solid #e8d7bd;background:#fff;font-size:12px;color:#635a52;font-weight:600}.tab.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#7a0f28,#9b1b3a)}
.list{display:grid;gap:10px}.item{background:var(--card);border:1px solid var(--l);border-radius:12px;box-shadow:var(--s);padding:10px;display:grid;grid-template-columns:90px 1fr;gap:10px}.img{border-radius:10px;background:linear-gradient(145deg,#f9ecd8,#e7c491)}
.name{margin:0;font-size:14px;color:#3d1921}.meta{margin:3px 0 0;font-size:12px;color:#675d55;line-height:1.45}.price{margin-top:6px;font-size:12px}.price b{color:#9a1f3d;font-size:20px}.old{text-decoration:line-through;color:#958b82;margin-left:6px}
.tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:#f9efe3;border:1px solid #ead7bb;color:#785030}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.left{font-size:11px;color:#8d837a}.go{border:0;height:30px;padding:0 12px;border-radius:999px;color:#fff;font-size:12px;font-weight:700;background:linear-gradient(135deg,#7a0f28,#9b1b3a)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:375px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #eadfcd;background:rgba(255,250,242,.98);display:grid;grid-template-columns:repeat(5,1fr)}.nav a{text-decoration:none;text-align:center;font-size:11px;color:#6f665f}.nav a.active{color:var(--p);font-weight:700}
</style></head><body>
<div class="phone"><header class="top"><div class="row"><a class="btn-link" href="home.html">返回</a><div class="tt">酒类拼团</div><a class="btn-link" href="drinking-game.html">酒局</a></div><div class="sub">酒类专场拼团，附搭餐和口感标签，适合小聚、节日送礼与社交开瓶场景。</div></header>
<main class="main"><section class="tabs"><button class="tab active" data-tab="open">开团中</button><button class="tab" data-tab="soon">即将开始</button><button class="tab" data-tab="end">已结束</button></section><section class="list" id="list"></section></main>
<nav class="nav"><a href="home.html">首页</a><a href="category.html">分类</a><a class="active" href="group-buy.html">活动</a><a href="digital-cellar.html">酒窖</a><a href="member-center.html">我的</a></nav></div>
<script>
const db={open:[{n:'蒙特斯经典赤霞珠 2020',b:'Montes',r:'智利',o:189,g:129,u:34,t:'01:25:20',tags:['口感:柔和','搭餐:牛排']},{n:'路易王妃香槟 NV',b:'Louis Roederer',r:'法国香槟',o:699,g:469,u:12,t:'03:08:11',tags:['口感:细腻气泡','搭餐:海鲜']}],soon:[{n:'高原骑士12年',b:'Highland Park',r:'苏格兰',o:389,g:269,u:0,t:'20:00 开团',tags:['口感:烟熏香草','搭餐:烤肋排']}],end:[{n:'里奥哈陈酿 2018',b:'Marques',r:'西班牙',o:268,g:179,u:50,t:'已结束',tags:['口感:橡木辛香','搭餐:火腿']} ]};
let tab='open';const list=document.getElementById('list');
function render(){list.innerHTML=db[tab].map(i=>`<article class="item"><div class="img"></div><div><h4 class="name">${i.n}</h4><p class="meta">品牌：${i.b} · 产区：${i.r}</p><p class="price">原价 <span class="old">￥${i.o}</span> 拼团价 <b>￥${i.g}</b></p><div class="tags">${i.tags.map(t=>`<span class='tag'>${t}</span>`).join('')}</div><div class="bottom"><span class="left">已参团 ${i.u} 人 · 剩余 ${i.t}</span><button class="go" ${tab==='end'?'disabled style="opacity:.5"':''}>去参团</button></div></div></article>`).join('');}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');render();});render();
</script></body></html>
