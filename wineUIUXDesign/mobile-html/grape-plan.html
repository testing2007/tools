<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><title>葡萄酒养成计划</title>
<style>
:root{--bg:#f4ede3;--card:#fffaf2;--p:#711328;--t:#2f2a27;--l:#ead9bf;--s:0 8px 24px rgba(113,19,40,.1)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 10% 0%,#fff9ef,#f3ebdf 46%,#ecdfce 100%);color:var(--t)}.phone{max-width:375px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;padding:10px 12px 12px;border-bottom-left-radius:14px;border-bottom-right-radius:14px;background:linear-gradient(145deg,#3b4a1f,#6f7f29 60%,#6e1a2f);color:#fff}.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.btn-link{text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);border-radius:999px;padding:6px 10px;font-size:12px}.tt{text-align:center;font-size:16px;font-weight:700}.sub{margin-top:8px;font-size:12px;line-height:1.5;color:#edf7d6;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
.main{padding:12px;display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--l);border-radius:14px;box-shadow:var(--s);padding:10px}.v{font-size:16px;font-weight:800;color:#411a22}.line{font-size:12px;color:#5f554d;background:#fff;border:1px dashed #ead5b0;border-radius:10px;padding:8px;margin-bottom:7px}
.bar{height:10px;background:#f0e5d6;border-radius:999px;overflow:hidden}.fill{height:100%;width:58%;background:linear-gradient(90deg,#6a9c2e,#a8d157)}.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{height:34px;border:0;border-radius:999px;color:#fff;font-size:12px;font-weight:700;background:linear-gradient(135deg,#7a0f28,#9b1b3a)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.b{background:#fff;border:1px solid #ecdabf;border-radius:10px;padding:8px;text-align:center;font-size:12px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:375px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #eadfcd;background:rgba(255,250,242,.98);display:grid;grid-template-columns:repeat(5,1fr)}.nav a{text-decoration:none;text-align:center;font-size:11px;color:#6f665f}.nav a.active{color:var(--p);font-weight:700}
</style></head><body>
<div class="phone"><header class="top"><div class="row"><a class="btn-link" href="home.html">返回</a><div class="tt">葡萄酒养成计划</div><a class="btn-link" href="points-mall.html">奖励</a></div><div class="sub">轻游戏养成：种植、浇水、施肥、好友互访，成熟后兑换积分/优惠券/试饮资格。</div></header>
<main class="main"><section class="card"><div class="v">我的葡萄园：梅洛试验田</div><div class="line" style="margin-top:8px">当前成长阶段：开花期（第 3 阶段 / 共 5 阶段）</div><div class="line">阳光值 72 / 成长值 58</div><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="card"><div class="btns"><button class="btn" id="water">浇水</button><button class="btn" id="fert">施肥</button></div></section>
<section class="card"><h3 style="margin:0 0 8px;font-size:15px">好友互访</h3><div class="line">周五开瓶局 给你浇水 +5</div><div class="line">单宁观察员 给你施肥 +8</div></section>
<section class="card"><h3 style="margin:0 0 8px;font-size:15px">成熟奖励</h3><div class="grid"><div class="b">积分 300</div><div class="b">满199减30券</div><div class="b">试饮资格券</div><div class="b">酒局游戏加成卡</div></div></section></main>
<nav class="nav"><a href="home.html">首页</a><a href="category.html">分类</a><a class="active" href="grape-plan.html">活动</a><a href="digital-cellar.html">酒窖</a><a href="member-center.html">我的</a></nav></div>
<script>let g=58;const fill=document.getElementById('fill');function up(v){g=Math.min(100,g+v);fill.style.width=g+'%';}document.getElementById('water').onclick=()=>up(4);document.getElementById('fert').onclick=()=>up(7);</script>
</body></html>
