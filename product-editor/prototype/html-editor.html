<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 详情页编辑器 v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --success: #10b981;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-500: #6b7280;
            --gray-800: #1f2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #1e1e2e; }

        .toolbar {
            position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #fff;
            border-bottom: 1px solid var(--gray-200); display: flex; align-items: center;
            padding: 0 20px; gap: 12px; z-index: 100;
        }
        .logo { font-weight: 700; color: var(--primary); font-size: 18px; margin-right: 24px; }
        .toolbar-select {
            height: 38px; padding: 0 16px; border: 1px solid var(--gray-200);
            border-radius: 8px; font-size: 14px; min-width: 180px;
        }
        .toolbar-btn {
            height: 38px; padding: 0 16px; border: 1px solid var(--gray-200);
            background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px;
            font-weight: 500; display: flex; align-items: center; gap: 6px;
        }
        .toolbar-btn:hover { border-color: var(--primary); color: var(--primary); }
        .toolbar-btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .spacer { flex: 1; }
        .status { padding: 6px 12px; background: rgba(99, 102, 241, 0.1); color: var(--primary); border-radius: 20px; font-size: 12px; }

        .content-wrapper { padding-top: 56px; display: flex; justify-content: center; min-height: 100vh; }
        
        /* 容器：加载实际HTML内容 */
        #pageContainer {
            width: 1000px; background: #fff; box-shadow: 0 0 60px rgba(0,0,0,0.3);
            margin: 40px 0;
        }

        /* 可编辑元素高亮 */
        [data-editable] { cursor: text; transition: outline 0.15s; outline: 2px solid transparent; }
        [data-editable]:hover { outline: 2px dashed var(--primary); outline-offset: 4px; }
        [data-editable]:focus { outline: 2px solid var(--primary); outline-offset: 4px; }
        [data-slot] { cursor: pointer; transition: outline 0.15s; }
        [data-slot]:hover { outline: 3px dashed var(--success); outline-offset: 4px; }

        /* 模态框 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 200; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 16px; padding: 24px; max-width: 500px; width: 90%; }
        .modal h2 { font-size: 18px; color: var(--gray-800); margin-bottom: 20px; }
        .upload-area {
            border: 2px dashed var(--gray-200); border-radius: 12px; padding: 40px;
            text-align: center; cursor: pointer;
        }
        .upload-area:hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        /* Loading */
        .loading { position: fixed; inset: 0; background: rgba(255,255,255,0.95); display: none; align-items: center; justify-content: center; z-index: 300; flex-direction: column; gap: 16px; }
        .loading.show { display: flex; }
        .spinner { width: 48px; height: 48px; border: 4px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--gray-800); color: #fff; padding: 14px 28px; border-radius: 10px; font-size: 14px; opacity: 0; transition: all 0.3s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }

        .hidden { display: none; }

        /* Pexels 搜索结果 */
        .pexels-results {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            max-height: 400px; overflow-y: auto; padding: 4px;
        }
        .pexels-item {
            cursor: pointer; border-radius: 8px; overflow: hidden;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .pexels-item:hover { border-color: var(--primary); transform: scale(1.02); }
        .pexels-item img { width: 100%; height: 100px; object-fit: cover; display: block; }

        /* 图片变换控制面板 */
        .image-transform-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #fff; border-radius: 12px; padding: 16px 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); display: none; z-index: 150;
            min-width: 400px;
        }
        .image-transform-panel.show { display: block; }
        .transform-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .transform-header h3 { font-size: 14px; color: var(--gray-800); margin: 0; }
        .transform-row {
            display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
        }
        .transform-row label { width: 50px; font-size: 13px; color: var(--gray-500); }
        .transform-row input[type="range"] { flex: 1; }
        .transform-row span { width: 50px; text-align: right; font-size: 13px; color: var(--gray-800); }
        .transform-actions { display: flex; gap: 8px; margin-top: 12px; }
        .transform-actions button { flex: 1; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="logo">🎨 HTML 编辑器 v2</div>
        <select class="toolbar-select" id="productSelect" onchange="loadProduct(this.value)">
            <option value="swan-legend">🦢 法布朗传奇</option>
            <option value="bordeaux-gold">🏆 波尔多佳酿</option>
            <option value="medoc-cru">🏰 梅多克中级庄</option>
        </select>
        <button class="toolbar-btn" onclick="window.open('details/' + currentProduct + '/index.html', '_blank')">👁️ 原始预览</button>
        <div class="spacer"></div>
        <span class="status" id="status">📝 点击元素开始编辑</span>
        <button class="toolbar-btn" onclick="resetChanges()">↩️ 重置</button>
        <button class="toolbar-btn" onclick="showPexelsModal()">🖼️ 搜图</button>
        <button class="toolbar-btn" onclick="exportSingleImage()">📸 导出整页</button>
        <button class="toolbar-btn primary" onclick="exportAllSections()">📥 导出区块</button>
    </div>

    <div class="content-wrapper">
        <div id="pageContainer">
            <div style="padding: 100px; text-align: center; color: #999;">正在加载...</div>
        </div>
    </div>

    <!-- Image Upload Modal -->
    <div class="modal-overlay" id="imageModal">
        <div class="modal">
            <h2>🖼️ 替换图片</h2>
            <div class="upload-area" onclick="document.getElementById('imageInput').click()">
                <div style="font-size: 48px; margin-bottom: 12px;">📷</div>
                <div>点击上传图片</div>
                <div style="font-size: 12px; color: #999; margin-top: 8px;">支持 JPG、PNG</div>
            </div>
            <input type="file" id="imageInput" class="hidden" accept="image/*" onchange="handleImageUpload(this)">
            <div class="modal-actions">
                <button class="toolbar-btn" onclick="closeImageModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- Pexels 搜图模态框 -->
    <div class="modal-overlay" id="pexelsModal">
        <div class="modal" style="max-width: 800px;">
            <h2>🖼️ 搜索免费图片 (Pexels)</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <input type="text" id="pexelsQuery" class="toolbar-select" style="flex: 1;" placeholder="输入搜索关键词（英文效果更好）" value="red wine">
                <button class="toolbar-btn primary" onclick="searchPexels()">🔍 搜索</button>
            </div>
            <div id="pexelsResults" class="pexels-results">
                <div style="grid-column: span 4; text-align: center; color: #999; padding: 40px;">输入关键词后点击搜索</div>
            </div>
            <div class="modal-actions">
                <button class="toolbar-btn" onclick="closePexelsModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 图片变换控制面板 -->
    <div class="image-transform-panel" id="imageTransformPanel">
        <div class="transform-header">
            <h3>🖼️ 图片调整</h3>
            <button class="toolbar-btn" style="height: 28px; padding: 0 10px; font-size: 12px;" onclick="hideImageTransformPanel()">✕ 关闭</button>
        </div>
        <div class="transform-row">
            <label>缩放</label>
            <input type="range" id="imgScale" min="0.5" max="3" step="0.05" value="1" oninput="applyImageTransform()">
            <span id="imgScaleValue">100%</span>
        </div>
        <div class="transform-row">
            <label>旋转</label>
            <input type="range" id="imgRotate" min="-180" max="180" step="1" value="0" oninput="applyImageTransform()">
            <span id="imgRotateValue">0°</span>
        </div>
        <div class="transform-row">
            <label>X偏移</label>
            <input type="range" id="imgPanX" min="-200" max="200" step="1" value="0" oninput="applyImageTransform()">
            <span id="imgPanXValue">0px</span>
        </div>
        <div class="transform-row">
            <label>Y偏移</label>
            <input type="range" id="imgPanY" min="-200" max="200" step="1" value="0" oninput="applyImageTransform()">
            <span id="imgPanYValue">0px</span>
        </div>
        <div class="transform-actions">
            <button class="toolbar-btn" onclick="document.getElementById('imageInput').click()">📷 上传图片</button>
            <button class="toolbar-btn" onclick="showPexelsModal()">🖼️ 搜图替换</button>
        </div>
        <div class="transform-actions">
            <button class="toolbar-btn" onclick="resetImageTransform()">↩️ 重置变换</button>
            <button class="toolbar-btn primary" onclick="hideImageTransformPanel()">✓ 确认</button>
        </div>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div id="loadingText">处理中...</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let currentProduct = '';
        let currentImageSlot = null;
        let loadedStylesheet = null;

        window.onload = () => {
            const select = document.getElementById('productSelect');
            loadProduct(select.options[0].value);
        };

        async function loadProduct(productId) {
            currentProduct = productId;
            const container = document.getElementById('pageContainer');
            container.innerHTML = '<div style="padding:100px;text-align:center;color:#999;">加载中...</div>';

            try {
                // 加载HTML
                const htmlRes = await fetch(`details/${productId}/index.html`);
                const htmlText = await htmlRes.text();

                // 解析HTML，只提取body内容
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const pageContent = doc.querySelector('.detail-page') || doc.body;

                // 加载CSS
                const cssRes = await fetch(`details/${productId}/style.css`);
                const cssText = await cssRes.text();

                // 移除旧样式
                if (loadedStylesheet) loadedStylesheet.remove();

                // 注入新样式
                loadedStylesheet = document.createElement('style');
                loadedStylesheet.textContent = cssText;
                document.head.appendChild(loadedStylesheet);

                // 注入内容
                container.innerHTML = pageContent.outerHTML;

                // 设置可编辑
                setupEditableElements();

                showToast('✅ 产品已加载', 'success');
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div style="padding:100px;text-align:center;color:#f00;">加载失败: ${err.message}</div>`;
            }
        }

        function setupEditableElements() {
            // 文字可编辑
            document.querySelectorAll('#pageContainer [data-editable]').forEach(el => {
                el.setAttribute('contenteditable', 'true');
                
                // 确保 span 和 inline 元素可以正常编辑
                const tagName = el.tagName.toLowerCase();
                if (tagName === 'span' || tagName === 'td') {
                    el.style.display = el.style.display || (tagName === 'td' ? 'table-cell' : 'inline-block');
                    el.style.minWidth = '20px';
                    el.style.minHeight = '1em';
                }
                
                // 阻止失焦时内容消失
                el.style.webkitUserModify = 'read-write-plaintext-only';
                
                el.addEventListener('focus', () => {
                    document.getElementById('status').textContent = '✏️ 编辑: ' + el.dataset.editable;
                    el.style.background = 'rgba(99, 102, 241, 0.1)';
                });
                el.addEventListener('blur', () => {
                    document.getElementById('status').textContent = '📝 点击元素开始编辑';
                    el.style.background = '';
                });
                el.addEventListener('keydown', (e) => {
                    // 阻止回车换行（可选，如需支持多行则删除）
                    if (e.key === 'Enter' && tagName === 'span') {
                        e.preventDefault();
                    }
                });
            });

            // 图片可替换 + 可变换
            document.querySelectorAll('#pageContainer [data-slot]').forEach(slot => {
                slot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showImageTransformPanel(slot);
                });
            });
        }

        function handleImageUpload(input) {
            if (input.files && input.files[0] && currentImageSlot) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = currentImageSlot.querySelector('img');
                    if (img) {
                        img.src = e.target.result;
                        showToast('✅ 图片已替换', 'success');
                    }
                    closeImageModal();
                };
                reader.readAsDataURL(input.files[0]);
                input.value = '';
            }
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('show');
            currentImageSlot = null;
        }

        function resetChanges() {
            if (confirm('重置所有修改？')) loadProduct(currentProduct);
        }

        async function exportSingleImage() {
            const page = document.querySelector('#pageContainer .detail-page');
            if (!page) { showToast('❌ 没有内容可导出'); return; }

            showLoading('正在导出整页...');
            try {
                // 移除编辑状态的样式
                page.querySelectorAll('[data-editable]').forEach(el => el.style.outline = 'none');
                page.querySelectorAll('[data-slot]').forEach(el => el.style.outline = 'none');

                const canvas = await html2canvas(page, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff',
                    width: 1000,
                    windowWidth: 1000
                });

                const link = document.createElement('a');
                link.download = `${currentProduct}_full.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.92);
                link.click();

                hideLoading();
                showToast('✅ 导出成功', 'success');
            } catch (err) {
                hideLoading();
                console.error(err);
                showToast('❌ 导出失败: ' + err.message);
            }
        }

        async function exportAllSections() {
            const sections = document.querySelectorAll('#pageContainer .section');
            if (sections.length === 0) { showToast('❌ 没有区块可导出'); return; }

            showLoading('准备导出...');
            try {
                for (let i = 0; i < sections.length; i++) {
                    const section = sections[i];
                    const name = section.dataset.section || `section-${i+1}`;
                    document.getElementById('loadingText').textContent = `导出 ${name} (${i+1}/${sections.length})`;

                    // 移除编辑状态
                    section.querySelectorAll('[data-editable]').forEach(el => el.style.outline = 'none');
                    section.querySelectorAll('[data-slot]').forEach(el => el.style.outline = 'none');

                    const canvas = await html2canvas(section, {
                        scale: 2,
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: null,
                        width: 1000,
                        windowWidth: 1000
                    });

                    const link = document.createElement('a');
                    link.download = `${currentProduct}_${name}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.92);
                    link.click();

                    await new Promise(r => setTimeout(r, 600));
                }
                hideLoading();
                showToast(`✅ 已导出 ${sections.length} 个区块`, 'success');
            } catch (err) {
                hideLoading();
                console.error(err);
                showToast('❌ 导出失败: ' + err.message);
            }
        }

        function showLoading(text) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loading').classList.add('show');
        }
        function hideLoading() { document.getElementById('loading').classList.remove('show'); }
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + type;
            setTimeout(() => t.className = 'toast', 2500);
        }

        // ========== Pexels API 配置 ==========
        const PEXELS_API_KEY = '9uofWjsQ44gLmNnHXhjzCynIEoyru1ADJrb2rFucAjNrTZfRhAWsAUvD';

        // ========== Pexels 搜图功能 ==========
        function showPexelsModal() {
            document.getElementById('pexelsModal').classList.add('show');
        }

        function closePexelsModal() {
            document.getElementById('pexelsModal').classList.remove('show');
        }

        async function searchPexels() {
            const query = document.getElementById('pexelsQuery').value.trim();
            if (!query) {
                showToast('请输入搜索关键词');
                return;
            }
            
            const resultsDiv = document.getElementById('pexelsResults');
            resultsDiv.innerHTML = '<div style="grid-column: span 4; text-align: center; padding: 40px;">🔍 搜索中...</div>';

            try {
                const response = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=20&size=small`, {
                    headers: { Authorization: PEXELS_API_KEY }
                });
                const data = await response.json();

                if (data.photos && data.photos.length > 0) {
                    resultsDiv.innerHTML = data.photos.map(photo => `
                        <div class="pexels-item" onclick="usePexelsImage('${photo.src.large}')">
                            <img src="${photo.src.small}" alt="${photo.alt || ''}">
                        </div>
                    `).join('');
                } else {
                    resultsDiv.innerHTML = '<div style="grid-column: span 4; text-align: center; color: #999; padding: 40px;">未找到图片，请尝试其他关键词</div>';
                }
            } catch (err) {
                console.error('Pexels搜索错误:', err);
                resultsDiv.innerHTML = '<div style="grid-column: span 4; text-align: center; color: #ef4444; padding: 40px;">搜索失败，请重试</div>';
            }
        }

        function usePexelsImage(url) {
            if (!currentImageSlot) {
                showToast('⚠️ 请先点击页面中的图片区域选择替换位置');
                return;
            }
            
            const img = currentImageSlot.querySelector('img');
            if (img) {
                img.src = url;
                img.crossOrigin = 'anonymous';
                showToast('✅ 图片已替换', 'success');
            }
            closePexelsModal();
        }

        // ========== 图片变换功能 ==========
        function showImageTransformPanel(slot) {
            currentImageSlot = slot;
            const img = slot.querySelector('img');
            if (!img) return;
            
            // 解析当前 transform 值并设置滑块
            const transform = img.style.transform || '';
            const scaleMatch = transform.match(/scale\(([\d.]+)\)/);
            const rotateMatch = transform.match(/rotate\(([-\d.]+)deg\)/);
            const translateMatch = transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
            
            document.getElementById('imgScale').value = scaleMatch ? parseFloat(scaleMatch[1]) : 1;
            document.getElementById('imgRotate').value = rotateMatch ? parseFloat(rotateMatch[1]) : 0;
            document.getElementById('imgPanX').value = translateMatch ? parseFloat(translateMatch[1]) : 0;
            document.getElementById('imgPanY').value = translateMatch ? parseFloat(translateMatch[2]) : 0;
            
            updateTransformDisplay();
            document.getElementById('imageTransformPanel').classList.add('show');
            document.getElementById('status').textContent = '🖼️ 调整图片: ' + (slot.dataset.slot || '图片');
        }

        function hideImageTransformPanel() {
            document.getElementById('imageTransformPanel').classList.remove('show');
            document.getElementById('status').textContent = '📝 点击元素开始编辑';
        }

        function applyImageTransform() {
            if (!currentImageSlot) return;
            
            const img = currentImageSlot.querySelector('img');
            if (!img) return;
            
            const scale = document.getElementById('imgScale').value;
            const rotate = document.getElementById('imgRotate').value;
            const panX = document.getElementById('imgPanX').value;
            const panY = document.getElementById('imgPanY').value;
            
            img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale}) rotate(${rotate}deg)`;
            
            updateTransformDisplay();
        }

        function updateTransformDisplay() {
            document.getElementById('imgScaleValue').textContent = Math.round(document.getElementById('imgScale').value * 100) + '%';
            document.getElementById('imgRotateValue').textContent = document.getElementById('imgRotate').value + '°';
            document.getElementById('imgPanXValue').textContent = document.getElementById('imgPanX').value + 'px';
            document.getElementById('imgPanYValue').textContent = document.getElementById('imgPanY').value + 'px';
        }

        function resetImageTransform() {
            if (!currentImageSlot) return;
            
            const img = currentImageSlot.querySelector('img');
            if (img) {
                img.style.transform = '';
            }
            
            document.getElementById('imgScale').value = 1;
            document.getElementById('imgRotate').value = 0;
            document.getElementById('imgPanX').value = 0;
            document.getElementById('imgPanY').value = 0;
            updateTransformDisplay();
            
            showToast('✅ 变换已重置', 'success');
        }

        // 关闭模态框时也清理 currentImageSlot（但保留变换面板打开时的状态）
        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('show');
            // 仅当变换面板未显示时才清理 slot
            if (!document.getElementById('imageTransformPanel').classList.contains('show')) {
                currentImageSlot = null;
            }
        }

        // 点击页面其他地方关闭变换面板
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('imageTransformPanel');
            const isClickInPanel = panel.contains(e.target);
            const isClickInSlot = e.target.closest('[data-slot]');
            
            if (panel.classList.contains('show') && !isClickInPanel && !isClickInSlot) {
                hideImageTransformPanel();
            }
        });
    </script>
</body>
</html>
